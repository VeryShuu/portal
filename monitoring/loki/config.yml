# Reference Loki configuration — single-binary (monolith).
#
# Достаточно для интранет-портала на ~300 сотрудников. Все компоненты
# (distributor/ingester/querier/compactor) в одном процессе — простота
# эксплуатации, нет распределённых зависимостей (memberlist/cassandra).
#
# Источники логов: Alloy (docker-container discovery) push'ит через
# /loki/api/v1/push на :3100. Auth НЕТ — порт доступен только в сети
# portal_internal (см. docker-compose.monitoring.yml).
#
# Документация: https://grafana.com/docs/loki/latest/configure/

auth_enabled: false  # закрытый периметр/VPN — единый tenant

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

# Подключения к Loki от Alloy и Grafana — из той же docker-сети.
# Произвольные внешние подключения исключены топологией (network internal: true).
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Loki 3.x: single-binary — режим по умолчанию (target=all), отдельное
# поле single_binary не нужно (было в 2.x, удалено). Все роли
# (distributor/ingester/querier/compactor) в одном процессе.

ingester:
  chunk_idle_period: 30m        # закрывать чанк, если в него не пишут 30 мин
  chunk_target_size: 1572864    # ~1.5 МБ — целевой размер чанка
  max_chunk_age: 1h             # максимальное время жизни чанка

# Лимиты ingestion/query — защита от «loud neighbour» и мусора.
limits_config:
  retention_period: 720h        # 30 дней — как Prometheus TSDB
  ingestion_rate_mb: 8          # МБ/с на tenant (для одного tenant'а — щедро)
  ingestion_burst_size_mb: 16
  max_streams_per_user: 10000
  max_query_length: 721h        # запросы до 30 дней (retention + запас)
  reject_old_samples: true      # не принимать логи старше 168ч (защита от
  reject_old_samples_max_age: 168h  # повторов/мусора при рестарте сборщика)
  allow_structured_metadata: true   # Loki 3.x: JSON-метаданные structlog

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true       # удалять чанки старше retention_period
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

schema_config:
  configs:
    - from: 2024-01-01          # фиксированная дата — схема стабильна
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-tmp
  alertmanager_url: http://alertmanager:9093
  ring:
    kvstore:
      store: inmemory
  enable_api: true

analytics:
  reporting_enabled: false      # интранет — никаких phone-home в grafana.net
