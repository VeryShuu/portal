# Portal alerting rules — reference.
#
# Философия: алерт = «человек должен посмотреть СЕЙЧАС». Всё, что
# самовосстанавливается (единичный 5xx, кратковременный lag снапшота), —
# не алертим. Минимальный `for:` — 2–5 мин, чтобы дать системе settle.
#
# Метрики, на которые опираемся (см. backend/app/core/metrics.py):
#   http_requests_total{status,handler}        — RED (prometheus_fastapi_instrumentator)
#   http_request_duration_seconds_bucket       — latency histogram
#   portal_audit_queue_depth                   — gauge (Redis audit_queue)
#   portal_audit_processing_depth              — gauge (Redis audit_processing)
#   portal_audit_events_pushed_total           — counter (rate push)
#   portal_sse_connections                     — gauge (open SSE streams)
#   portal_active_users_last_1h                — gauge
#   up{job="portal"}                           — scrape success
#
# Worker heartbeat — cron `worker_heartbeat` пишет unix-timestamp в Redis
# (ключ `arq:heartbeat:mtime`), который гидрируется в gauge
# `portal_worker_last_heartbeat_seconds`. Age = time() - gauge — прямой датчик
# смерти воркера (см. PortalWorkerDown ниже). Отдельный TTL-key `arq:heartbeat`
# (без timestamp) остаётся для Docker healthcheck.

groups:
  # ===================================================================
  # Meta-monitoring — здоровье самого observability-стека.
  # Если умирает Prometheus/Alertmanager/Grafana/Loki/Alloy, остальной
  # алертинг молча гибнет. Watchdog — всегда-firing heartbeat: его пропажа
  # из уведомлений = умер прометей или alertmanager. Down-алерты ловят
  # каждый компонент по отдельности.
  # ===================================================================
  - name: portal-meta
    interval: 30s
    rules:
      # Watchdog — всегда firing. Это «маяк»: если он перестал приходить в
      # уведомления, значит Prometheus не eval'ит rules или Alertmanager не
      # шлёт (т.е. умер один из них). Канонический паттерн из best-practices.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: warning
          service: monitoring
        annotations:
          summary: "Monitoring watchdog alive"
          description: "Этот алерт всегда firing. Если он перестал приходить в уведомления — умер Prometheus или Alertmanager (остальные алерты тоже молча не уходят). Проверить `docker compose ps prometheus alertmanager` (overlay monitoring)."

      # Prometheus — не отвечает на self-scrape. Без него весь алертинг мёртв.
      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 2m
        labels:
          severity: critical
          service: monitoring
        annotations:
          summary: "Prometheus недоступен"
          description: "Prometheus не отвечает на self-scrape (:9090/metrics). Весь остальной алертинг не работает, пока он мёртв. Проверить `docker compose ps prometheus` (overlay monitoring), логи `docker compose logs prometheus`, свободное место на диске (retention 30d)."

      # Alertmanager — мёртв. Прометей eval'ит алерты, но некому их доставить.
      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 2m
        labels:
          severity: critical
          service: monitoring
        annotations:
          summary: "Alertmanager недоступен"
          description: "Alertmanager не отвечает на scrape (:9093/-/ready). Prometheus eval'ит алерты, но некому доставить уведомления. Проверить `docker compose ps alertmanager` (overlay monitoring), логи, SMTP-настройки."

      # Grafana — мёртв. UI observability недоступен (алерты при этом идут).
      - alert: GrafanaDown
        expr: up{job="grafana"} == 0
        for: 5m
        labels:
          severity: warning
          service: monitoring
        annotations:
          summary: "Grafana недоступна"
          description: "Grafana не отвечает на scrape (:3000/metrics). UI observability (дашборды) недоступен. Алерты при этом работают (Alertmanager независим). Проверить `docker compose ps grafana` (overlay monitoring)."

      # Loki — мёртв. Centralized-логи не принимаются (но Grafana-alternatives живы).
      - alert: LokiDown
        expr: up{job="loki"} == 0
        for: 5m
        labels:
          severity: warning
          service: monitoring
        annotations:
          summary: "Loki недоступен"
          description: "Loki не отвечает на scrape (:3100/ready). Centralized-логи не принимаются (поиск по request_id и т.п. через Grafana нерабочий). Проверить `docker compose ps loki` (overlay monitoring), свободное место на volume loki-data."

      # Alloy — мёртв. Сбор логов остановлен (логи контейнеров не доходят до Loki).
      - alert: AlloyDown
        expr: up{job="alloy"} == 0
        for: 5m
        labels:
          severity: warning
          service: monitoring
        annotations:
          summary: "Alloy (сборщик логов) недоступен"
          description: "Alloy не отвечает на scrape (:12345/-/ready). Сбор Docker-логов остановлен — новые логи не поступают в Loki. Проверить `docker compose ps alloy` (overlay monitoring), Docker socket mount."

  # ===================================================================
  # Availability — базовое «живо ли вообще»
  # ===================================================================
  - name: portal-availability
    interval: 30s
    rules:
      # Backend не отвечает на scrape 3 подряд попытки (≈1.5 мин).
      - alert: PortalBackendDown
        expr: up{job="portal"} == 0
        for: 1m
        labels:
          severity: critical
          service: portal-backend
        annotations:
          summary: "Portal backend недоступен для scrape"
          description: "Prometheus не может получить /metrics от {{ $labels.instance }} уже {{ $value }} (up=0). Проверить `docker compose ps backend`, логи backend."

      # Multiple 5xx за окно — что-то системно сломалось.
      # rate за 5 мин × 100% > 5% от всех запросов, при абсолютном минимуме 10 ошибок.
      - alert: PortalHighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{job="portal", status=~"5.."}[5m])) by (service)
            /
            clamp_min(sum(rate(http_requests_total{job="portal"}[5m])) by (service), 1)
          ) > 0.05
          and
          sum(rate(http_requests_total{job="portal", status=~"5.."}[5m])) by (service) > 0.03
        for: 5m
        labels:
          severity: critical
          service: portal-backend
        annotations:
          summary: "Высокий уровень 5xx ошибок на портале"
          description: "Доля 5xx ответов > 5% при rate > 0.03/s (≈3/мин) в течение 5 мин. Смотреть логи backend (`docker compose logs backend`) и дашборд Grafana."

  # ===================================================================
  # Audit pipeline — буферизованная очередь Redis → PostgreSQL
  # ===================================================================
  - name: portal-audit-pipeline
    interval: 30s
    rules:
      # Очередь растёт — воркер не успевает flush'ить (или вообще мёртв).
      # >1000 событий pending — индикатор проблемы (обычно там 0–50).
      - alert: PortalAuditQueueBacklog
        expr: portal_audit_queue_depth > 1000
        for: 5m
        labels:
          severity: warning
          service: portal-audit
        annotations:
          summary: "Audit queue растёт ({{ $value }} событий)"
          description: "Redis-очередь audit_queue > 1000 событий уже 5 мин. Проверить `docker compose ps worker`, логи `audit.flush_*`. Возможно упал flush_audit_queue cron."

      # Processing list не очищается — воркер взял батч, но не закоммитил
      # в БД. Может быть symptom упавшей PG-связности или deadlock.
      - alert: PortalAuditFlushStuck
        expr: portal_audit_processing_depth > 0
        for: 10m
        labels:
          severity: warning
          service: portal-audit
        annotations:
          summary: "Audit processing list завис ({{ $value }} событий)"
          description: "Redis-список audit_processing > 0 уже 10 мин — батч взят воркером, но не закоммичен/не очищен. Проверить `audit:flush:lock` в Redis и БД-связность."

      # Audit push rate упал в ноль — события больше не эмитятся.
      # На активном портале (~300 юзеров) за 5 мин точно есть хотя бы 1 событие.
      - alert: PortalAuditPushRateZero
        expr: rate(portal_audit_events_pushed_total[5m]) == 0
        for: 10m
        labels:
          severity: warning
          service: portal-audit
        annotations:
          summary: "Audit-события не эмиттятся"
          description: "За последние 10 мин счётчик audit_events_pushed_total не растёт. Либо порталом никто не пользуется, либо сломался push_audit_event (Redis down?)."

  # ===================================================================
  # Worker health — ARQ cron jobs и heartbeat
  # ===================================================================
  - name: portal-worker
    interval: 30s
    rules:
      # PRIMARY — прямой датчик смерти воркера. Cron `worker_heartbeat` каждые
      # 30с пишет unix-timestamp в Redis → gauge portal_worker_last_heartbeat_seconds
      # (гидрируется из snapshot). Age = time() - gauge.
      #
      # Порог 120с = heartbeat-интервал (30с) × 4 + запас. Heartbeat-TTL в Redis
      # 90с, но snapshot обновляется 30с, поэтому после смерти воркера gauge
      # «замрёт» на последнем значении и age начнёт расти сразу. 120с покрывает:
      # 1 пропущенный цикл (норма) + лаг snapshot + лаг scrape.
      #
      # В отличие от PortalWorkerStale (ниже), этот алерт сработает даже если
      # очередь audit пуста (воркер умер в простое) — старая реализация была
      # слепа в этом случае (false-negative на тихую смерть).
      - alert: PortalWorkerDown
        expr: time() - portal_worker_last_heartbeat_seconds > 120
        for: 1m
        labels:
          severity: critical
          service: portal-worker
        annotations:
          summary: "ARQ-воркер не подаёт признаков жизни"
          description: "Heartbeat воркера не обновлялся уже {{ $value | humanizeDuration }} (> 120с). Воркер завис или упал — cron'ы (audit flush, outbox dispatch, integration probes) не выполняются. Проверить `docker compose ps worker`, логи `arq_worker.*`, ключ Redis `arq:heartbeat`."

      # SECONDARY — воркер жив (heartbeat тикает), но refresh_custom_metrics
      # завис: кастомные гейджи застывают. Ловит subtler case: event-loop
      # блокирован долгой задачей, cron не крутится, но процесс отвечает.
      # Оставлен как доп. сигнал; основной датчик — PortalWorkerDown выше.
      - alert: PortalWorkerStale
        expr: changes(portal_audit_queue_depth[3m]) == 0 and portal_audit_queue_depth > 0
        for: 5m
        labels:
          severity: warning
          service: portal-worker
        annotations:
          summary: "ARQ-воркер: кастомные гейджи застывают"
          description: "Гейдж portal_audit_queue_depth не менялся 3 мин при ненулевой очереди — cron refresh_custom_metrics/flush_audit_queue не выполняется, хотя heartbeat жив. Event-loop возможно блокирован долгой задачей. Проверить логи worker."

      # ARQ job failures — задачи падают и не проходят даже после retry.
      # >0.1/s (≈6/min) failures за 10-мин окно на 5 мин — системная проблема.
      # Метрика portal_arq_jobs_total{status="failed"} гидрируется из Redis
      # (worker → snapshot → API /metrics), см. backend/app/worker/tasks/metrics.py.
      - alert: PortalArqJobFailures
        expr: sum(rate(portal_arq_jobs_total{status="failed"}[10m])) by (function) > 0.1
        for: 5m
        labels:
          severity: warning
          service: portal-worker
        annotations:
          summary: "ARQ-задачи падают: {{ $labels.function }}"
          description: "rate(portal_arq_jobs_total{status=\"failed\"}) > 0.1/s (≈6/мин) для {{ $labels.function }} уже 5 мин. Проверить логи worker (`docker compose logs worker`), возможно upstream (SMTP/Nextcloud/БД) недоступен."

  # ===================================================================
  # Saturation — ресурсы и ёмкость
  # ===================================================================
  - name: portal-saturation
    interval: 30s
    rules:
      # Медленные запросы — p99 latency > 5s на 5 мин окне.
      # histogram_quantile по handler — находит конкретный медленный endpoint.
      - alert: PortalHighLatencyP99
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket{job="portal"}[5m])) by (le, handler)
          ) > 5
        for: 5m
        labels:
          severity: warning
          service: portal-backend
        annotations:
          summary: "Высокая p99-латентность (handler={{ $labels.handler }})"
          description: "p99 latency > 5s для handler={{ $labels.handler }} в течение 5 мин. Возможные причины: медленный SQL-запрос, блокировки БД, нехватка соединений пула."

      # SSE-соединения (уведомления) — portal_sse_connections, обновляется
      # раз в 30с из Redis ZSET sse:global. При ~300 юзеров норма — десятки
      # открытых стримов. > 500 устойчиво — явный признак утечки: браузеры не
      # закрывают EventSource (вкладки-зомби, обрыв сети без reconnect-логики).
      - alert: PortalSSEConnectionsHigh
        expr: portal_sse_connections > 500
        for: 10m
        labels:
          severity: warning
          service: portal-backend
        annotations:
          summary: "Аномальный рост SSE-соединений ({{ $value }})"
          description: "Открыто > 500 SSE-стримов уведомлений уже 10 мин. Норма для ~300 юзеров — десятки. Вероятна утечка: незакрытые EventSource в браузерах, вкладки-зомби или обрывы сети без корректного reconnect. Проверить ZSET sse:global в Redis и логику закрытия стримов в frontend."

      # Фото-хранилище > 100 ГБ — порог для планирования расширения.
      # Низкий priority, чисто информационный.
      - alert: PortalPhotoStorageHigh
        expr: portal_photo_storage_bytes > 1e11  # 100 GB
        for: 1h
        labels:
          severity: info
          service: portal-photos
        annotations:
          summary: "Фото-хранилище большое ({{ $value | humanize1024 }})"
          description: "/data/photos/originals превысил 100 ГБ. Планировать ёмкость или чистить по retention."

  # ===================================================================
  # PostgreSQL — пул соединений, cache hit ratio, XID wraparound
  # ===================================================================
  - name: portal-postgresql
    interval: 30s
    rules:
      # Использование пула соединений > 80%. Backend использует asyncpg pool;
      # при насыщении новые запросы ждут соединение → растёт latency.
      - alert: PortalPGConnectionsHigh
        expr: |
          sum(pg_stat_activity_count)
          / clamp_min(pg_settings_max_connections, 1)
          > 0.8
        for: 5m
        labels:
          severity: warning
          service: portal-postgres
        annotations:
          summary: "PostgreSQL: пул соединений насыщен ({{ $value | humanizePercentage }})"
          description: "Активных соединений > 80% от max_connections уже 5 мин. Проверить долгие транзакции (pg_stat_activity), pool size backend'а, возможные connection leaks."

      # Cache hit ratio < 90% — БД чаще читает с диска, чем из кэша.
      # Индикатор нехватки shared_buffers или отсутствующих индексов.
      - alert: PortalPGCacheHitLow
        expr: |
          (
            sum(pg_stat_database_blks_hit)
            / clamp_min(sum(pg_stat_database_blks_hit + pg_stat_database_blks_read), 1)
          ) < 0.9
          and sum(pg_stat_database_blks_hit + pg_stat_database_blks_read) > 10000
        for: 10m
        labels:
          severity: warning
          service: portal-postgres
        annotations:
          summary: "PostgreSQL: низкий cache hit ratio ({{ $value | humanizePercentage }})"
          description: "Cache hit ratio < 90% при значимом объёме операций. Возможные причины: нехватка shared_buffers, отсутствующие индексы, большие seq-scan'ы. Проверить pg_stat_statements."

      # XID wraparound — возраст старейшего незамороженного XID в секундах.
      # autovacuum должен регулярно замораживать (freeze) старые XID. Если
      # значение растёт (нет заморозки > 30 дней) — autovacuum не справляется,
      # близко к read-only защите от wraparound. Метрика в секундах (НЕ XID count).
      - alert: PortalPGWraparound
        expr: pg_database_wraparound_age_datfrozenxid_seconds > 2592000  # 30 days
        for: 10m
        labels:
          severity: warning
          service: portal-postgres
        annotations:
          summary: "PostgreSQL: возраст незамороженного XID большой ({{ $value | humanizeDuration }})"
          description: "Возраст старейшего незамороженного XID в БД {{ $labels.datname }} > 30 дней — autovacuum не замораживает старые транзакции. Запустить VACUUM FREEZE вручную, проверить autovacuum-настройки."

      # Дедлоки — всегда баг в коде. Любой дедлок за окно — повод разобраться.
      - alert: PortalPGDeadlocks
        expr: rate(pg_stat_database_deadlocks[5m]) > 0
        for: 2m
        labels:
          severity: warning
          service: portal-postgres
        annotations:
          summary: "PostgreSQL: обнаружены дедлоки"
          description: "rate(pg_stat_database_deadlocks) > 0 — параллельные транзакции конфликтуют. Проверить логи PG (`docker compose logs postgres`), выявить конкурирующие транзакции."

  # ===================================================================
  # Redis — память, evictions, keyspace
  # ===================================================================
  - name: portal-redis
    interval: 30s
    rules:
      # Память Redis > 90% от maxmemory — близко к eviction-режиму.
      # Redis критичен: сессии, SSE, audit-очередь, rate-limit, idempotency.
      - alert: PortalRedisMemoryHigh
        expr: |
          redis_memory_used_bytes
          / clamp_min(redis_memory_max_bytes, 1) > 0.9
        for: 5m
        labels:
          severity: warning
          service: portal-redis
        annotations:
          summary: "Redis: память接近 maxmemory ({{ $value | humanizePercentage }})"
          description: "Использование памяти Redis > 90% от maxmemory. При превышении начнутся evictions (политика maxmemory-policy). Проверить большие ключи (`redis-cli --bigkeys`), увеличить REDIS_MAXMEMORY."

      # Evictions — ключи удаляются по политике maxmemory. На портале Redis не
      # должен evict'ить (сессии/audit терять нельзя). >10/min — проблема.
      - alert: PortalRedisEvictions
        expr: rate(redis_evicted_keys_total[5m]) > 0.17
        for: 5m
        labels:
          severity: warning
          service: portal-redis
        annotations:
          summary: "Redis: высокая скорость evictions ({{ $value }}/s)"
          description: "Redis удаляет ключи по политике maxmemory — памяти не хватает. Критично: могут теряться сессии/audit-события. Увеличить REDIS_MAXMEMORY в .env (требует рестарта redis)."

      # Keyspace hit ratio < 90% — редко для Redis, но при больших наборах
      # данных стоит проверить, не ушли ли горячие ключи на диск.
      - alert: PortalRedisKeyspaceLow
        expr: |
          (
            sum(rate(redis_keyspace_hits_total[5m]))
            / clamp_min(
              sum(rate(redis_keyspace_hits_total[5m]))
              + sum(rate(redis_keyspace_misses_total[5m])), 1
            )
          ) < 0.9
          and
          (
            sum(rate(redis_keyspace_hits_total[5m]))
            + sum(rate(redis_keyspace_misses_total[5m]))
          ) > 10
        for: 10m
        labels:
          severity: warning
          service: portal-redis
        annotations:
          summary: "Redis: низкий keyspace hit ratio ({{ $value | humanizePercentage }})"
          description: "Keyspace hit ratio < 90% при значимом трафике. Возможные причины: TTL-ключи истекают быстрее, чем переиспользуются, или данные не помещаются в память."

  # ===================================================================
  # Host — диск, CPU, RAM (node_exporter)
  # ===================================================================
  - name: portal-host
    interval: 30s
    rules:
      # Свободное место на диске < 15% — критично. /data хранит фото, БД
      # (если volume), логи. Disk full = падение сервисов.
      - alert: PortalDiskSpaceLow
        expr: |
          (1 -
            node_filesystem_avail_bytes
            / clamp_min(node_filesystem_size_bytes, 1)
          ) > 0.85
        for: 5m
        labels:
          severity: critical
          service: portal-host
        annotations:
          summary: "Мало места на диске: {{ $labels.mountpoint }} (занято {{ $value | humanizePercentage }})"
          description: "Файловая система {{ $labels.mountpoint }} ({{ $labels.device }}) заполнена > 85%. Критично — disk full ломает запись фото/БД/логов. Проверить `docker system df`, старые образы, /data/photos, логи."

      # Нагрузка на CPU > 80% на 5 мин — деградация latency для всех сервисов.
      - alert: PortalCPUHigh
        expr: |
          (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.8
        for: 5m
        labels:
          severity: warning
          service: portal-host
        annotations:
          summary: "Высокая загрузка CPU ({{ $value | humanizePercentage }})"
          description: "CPU utilization > 80% на хосте {{ $labels.instance }} уже 5 мин. Проверить `docker stats` — какой контейнер грузит, топ-процессы. Возможна нехватка ядер под нагрузку."

      # Свободная RAM < 10% — близко к OOM-kill. Контейнеры начнут свопать.
      - alert: PortalRAMLow
        expr: |
          node_memory_MemAvailable_bytes
          / clamp_min(node_memory_MemTotal_bytes, 1) < 0.1
        for: 5m
        labels:
          severity: warning
          service: portal-host
        annotations:
          summary: "Мало свободной RAM ({{ $value | humanizePercentage }})"
          description: "Доступная RAM < 10%. Возможен OOM-kill контейнеров. Проверить `docker stats`, настройки memory-limits сервисов, REDIS_MAXMEMORY/PostgreSQL shared_buffers."

  # ===================================================================
  # Nginx — соединения (stub_status)
  # ===================================================================
  - name: portal-nginx
    interval: 30s
    rules:
      # Active connections > 1000 — для ~300 юзеров аномально. Может быть
      # признаком утечки keepalive-соединений или атаки.
      - alert: PortalNginxConnectionsHigh
        expr: nginx_connections_active > 1000
        for: 5m
        labels:
          severity: warning
          service: portal-nginx
        annotations:
          summary: "Nginx: много активных соединений ({{ $value }})"
          description: "Active connections nginx > 1000 уже 5 мин. Норма для ~300 юзеров — десятки-сотни (с учётом keepalive). Проверить `nginx -T` keepalive_timeout, логи доступа на аномальный трафик."

  # ===================================================================
  # Outbox — email и messenger (MAX) рассылки
  # Без этих алертов копящиеся/DLQ-ящиеся письма невидимы до жалоб юзеров.
  # ===================================================================
  - name: portal-outbox
    interval: 30s
    rules:
      # Email outbox растёт — SMTP недоступен или медленный. Обычно PENDING ~0.
      # > 50 устойчиво = письма не уходят.
      - alert: PortalEmailOutboxBacklog
        expr: portal_email_outbox_pending > 50
        for: 5m
        labels:
          severity: warning
          service: portal-email
        annotations:
          summary: "Email outbox растёт ({{ $value }} писем в очереди)"
          description: "PENDING-писем > 50 уже 5 мин. SMTP недоступен или медленный. Проверить `docker compose logs worker` (email_outbox.dispatch.*), SMTP-настройки (email-settings.json), reachability SMTP-сервера."

      # DLQ накопился — письма безвозвратно потеряны после 6 попыток.
      # Любое значение > 0 требует разбора (почему упорные ошибки).
      - alert: PortalEmailOutboxDLQ
        expr: portal_email_outbox_dlq > 0
        for: 10m
        labels:
          severity: warning
          service: portal-email
        annotations:
          summary: "Email outbox: {{ $value }} писем в DLQ"
          description: "Письма попали в dead-letter после 6 неудачных попыток. Безвозвратно потеряны. Разобрать через Admin UI (email-outbox) — посмотреть last_error, повторить вручную если нужно."

      # Stale SENDING — worker взял батч, но завис/упал до commit.
      # requeue_stale_sending лечит, но если повторяется — системная проблема.
      - alert: PortalEmailOutboxStuck
        expr: portal_email_outbox_sending_stale > 0
        for: 10m
        labels:
          severity: warning
          service: portal-email
        annotations:
          summary: "Email outbox: {{ $value }} писем застряли в SENDING"
          description: "Письма в SENDING > 10 мин — worker взял их, но не закоммитил (краш mid-dispatch?). Watchdog requeue_stale_sending должен лечить; если повторяется — проверить логи worker."

      # Messenger outbox (MAX) — аналогично email.
      - alert: PortalMessengerOutboxBacklog
        expr: portal_messenger_outbox_pending > 50
        for: 5m
        labels:
          severity: warning
          service: portal-messenger
        annotations:
          summary: "Messenger outbox (MAX) растёт ({{ $value }} сообщений)"
          description: "PENDING-сообщений MAX > 50 уже 5 мин. MAX API недоступен, неверный токен/chat_id, или rate-limit. Проверить `docker compose logs worker` (messenger_outbox.*), настройки MAX-бота (helpdesk_max_bot_settings)."

      - alert: PortalMessengerOutboxDLQ
        expr: portal_messenger_outbox_dlq > 0
        for: 10m
        labels:
          severity: warning
          service: portal-messenger
        annotations:
          summary: "Messenger outbox: {{ $value }} сообщений в DLQ"
          description: "MAX-сообщения в dead-letter после 6 попыток. Разобрать через Admin UI, проверить токен MAX-бота."

  # ===================================================================
  # Integrations — Keycloak, Nextcloud, SMTP, Collabora probes
  # probe_integrations cron проверяет каждые 60с. gauge=1(up)/0(down).
  # Интеграции не сконфигурированы → gauge отсутствует (no data, не алерт).
  # ===================================================================
  - name: portal-integrations
    interval: 30s
    rules:
      # Любая сконфигурированная интеграция упала > 3 мин.
      - alert: PortalIntegrationDown
        expr: portal_integration_up == 0
        for: 3m
        labels:
          severity: warning
          service: portal-integration
        annotations:
          summary: "Интеграция недоступна: {{ $labels.integration }}"
          description: "probe_integrations сообщает {{ $labels.integration }} = down уже 3 мин. Проверить: для keycloak — `docker compose logs backend` (keycloak.*), reachability IdP; для nextcloud — NC health (status.php), service account; для smtp — TCP-connect к host:port; для collabora — richdocuments app в NC."

  # ===================================================================
  # Synthetic — end-to-end user-flow probe (login + SPA load)
  # run_synthetic_probe cron каждые 5 мин вызывает screenshot-service /probe.
  # gauge отсутствует (no data) если PROBE_ADMIN_* не заданы — не алерт.
  # ===================================================================
  - name: portal-synthetic
    interval: 30s
    rules:
      # Synthetic flow упал 2 цикла подряд (≈10 мин). Ловит regressions
      # end-to-end: сломанный frontend, auth, routing — то, что инфра-метрики
      # (backend up, DB up) не видят.
      - alert: PortalSyntheticProbeFailed
        expr: portal_synthetic_probe_up == 0
        for: 10m
        labels:
          severity: warning
          service: portal-synthetic
        annotations:
          summary: "Synthetic-проверка user-flow упала"
          description: "Проба login_and_load (browser login + SPA load) падает > 10 мин. Проверить: frontend доступен (curl http://frontend:80), backend auth endpoint, screenshot-service логи (`docker compose logs screenshot-service`). Смотреть step_failed в логах worker (synthetic.probed)."
