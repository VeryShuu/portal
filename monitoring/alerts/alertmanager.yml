# Alertmanager configuration — email-доставка алертов админам.
#
# SMTP-relay: Alertmanager шлёт напрямую на корпоративный Postfix/relay,
# адрес которого задаётся через env-переменные (overlay compose передаёт их
# из .env / окружения). Это НЕ использует portal email_outbox намеренно:
# Alertmanager должен уметь уведомить даже когда упал backend/worker —
# поэтому независимый SMTP-путь критичен.
#
# Конфигурация env-переменных (задаются в .env или окружении запуска):
#   ALERT_SMTP_HOST       — хост SMTP-relay (напр. mail.corp.local)
#   ALERT_SMTP_PORT       — порт (25 / 587 / 465)
#   ALERT_SMTP_FROM       — адрес отправителя (напр. portal-alerts@corp.local)
#   ALERT_ADMINS_EMAIL    — список получателей через запятую
#   ALERT_DEADMAN_WEBHOOK_URL — URL внешнего dead-man приёмника для Watchdog
#                         (MON-13; пусто = внешний контроль не настроен,
#                         Watchdog гасится локальным no-op приёмником)
#   ALERT_SMTP_USER       — username для auth (пусто = без auth)
#   ALERT_SMTP_PASSWORD   — password для auth (пусто = без auth)
#
# При пустых ALERT_ADMINS_EMAIL/ALERT_SMTP_HOST — email не уходит (приёмник
# null), алерты видны только в UI Alertmanager. Это допустимо для отладки.
#
# Проверка конфига:
#   docker compose -f monitoring/docker-compose.monitoring.yml run --rm alertmanager \
#     amtool check-config /etc/alertmanager/alertmanager.yml

global:
  # SMTP-relay. Дефолты задаёт overlay-compose (через ${VAR:-default}), сюда
  # приходят уже раскрытые значения. ${VAR} без дефолта → Alertmanager при
  # пустой переменной подставит пустую строку (email-приёмник станет no-op).
  smtp_smarthost: "${ALERT_SMTP_HOST}:${ALERT_SMTP_PORT}"
  smtp_from: "${ALERT_SMTP_FROM}"
  smtp_hello: "portal-monitoring"
  smtp_auth_username: "${ALERT_SMTP_USER}"
  smtp_auth_password: "${ALERT_SMTP_PASSWORD}"
  # smtp_require_tls: ДЕФОЛТ Alertmanager = true; никакой «автоматики по порту»
  # у него нет — plaintext-relay на :25 без STARTTLS письмо не доставит
  # (аудит 2026-08: комментарий здесь ранее обещал авто-false на :25).
  # Значение подставляет render-alertmanager.sh из ALERT_SMTP_REQUIRE_TLS:
  # пусто → false при :25 (plaintext LAN-relay), true иначе; явное значение
  # в .env приоритетнее.
  # NB: без кавычек — YAML-bool; значение всегда строго true/false (вычисляет
  # render-alertmanager.sh, strip_quotes срезает случайные кавычки из .env).
  smtp_require_tls: ${ALERT_SMTP_REQUIRE_TLS}
  # resolve_timeout — сколько ждать, прежде чем считать алерт resolved,
  # если Prometheus перестал слать updates (например, при его рестарте).
  resolve_timeout: 5m

# Дерево routing'а: severity → конкретный receiver.
route:
  receiver: admins-email
  group_by: ["alertname", "service", "severity"]
  group_wait: 30s        # первый алерт в группе ждём 30с, потом шлём
  group_interval: 5m     # интервал между обновлениями группы
  repeat_interval: 4h    # повторно слать ту же группу не чаще 4ч
  routes:
    # MON-13: Watchdog — всегда-firing «маяк» — уходит ТОЛЬКО в dead-man
    # приёмник (внешний независимый контроль пропажи мониторинга), не в email:
    # иначе он заспамил бы админам каждые repeat_interval. Если внешний
    # сервис перестал получать пинги Watchdog — умер Prometheus (не eval'ит
    # rules) или Alertmanager (не шлёт), т.е. весь алертинг молча гибнет.
    # Первый совпавший route выигрывает (continue нет) — блок стоит первым.
    # Пинги каждые ~5 мин (repeat < group_interval даёт repeat по
    # group_interval): grace-окно внешнего сервиса ≥ 3× интервала (см.
    # docs/monitoring.md §«Dead-man контроль»).
    - matchers:
        - alertname = Watchdog
      receiver: deadman-webhook
      group_wait: 0s
      group_interval: 5m
      repeat_interval: 4m

    # Critical → без дедупликации, повтор каждые 30 мин (будит быстрее).
    - matchers:
        - severity = critical
      receiver: admins-email
      group_wait: 0s
      repeat_interval: 30m

    # Warning → основной канал с группировкой (наследуется от top-level).

    # Info → гасим (storage-growth и т.п. — не будим).
    - matchers:
        - severity = info
      receiver: info-null

receivers:
  # Основной приёмник — email админам. Список через запятую в ALERT_ADMINS_EMAIL.
  # При пустой переменной Alertmanager использует пустой список → письмо не уйдёт,
  # но алерт останется в UI (видно через /api/v2/alerts).
  - name: admins-email
    email_configs:
      - to: "${ALERT_ADMINS_EMAIL}"
        send_resolved: true
        headers:
          Subject: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }} ({{ .CommonLabels.service }})'
        # Тело письма — Go-template (Alertmanager использует text/template).
        html: |
          <h2>{{ .CommonLabels.alertname }}</h2>
          <p><b>Состояние:</b> {{ .Status }} · <b>Severity:</b> {{ .CommonLabels.severity }}</p>
          <p>{{ range .Alerts }}{{ .Annotations.summary }}<br>
          {{ .Annotations.description }}<br>
          <i>Firing since:</i> {{ .StartsAt.Format "2006-01-02 15:04:05" }}<br>
          <i>Labels:</i> {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}<br>{{ end }}</p>

    # Опциональный дубль алертов в Matrix (bridge matrix-alertmanager,
    # compose-profile `matrix` — см. docker-compose.monitoring.yml и .env.example,
    # секция «Алерты в Matrix»). Рендер-alertmanager.sh вырезает весь блок,
    # если ALERT_MATRIX_WEBHOOK_URL пуст — email остаётся единственным каналом.
    #@matrix-begin
    webhook_configs:
      - url: "${ALERT_MATRIX_WEBHOOK_URL}"
        send_resolved: true
    #@matrix-end

  # Dead-man приёмник Watchdog (MON-13): независимая точка, умеющая тревожить
  # при ПРОПАЖЕ пингов (healthchecks.io-совместимый webhook или self-hosted
  # аналог в разрешённом периметре). send_resolved:true — при graceful-стопе
  # Prometheus Alertmanager пришлёт resolved (resolve_timeout 5m), внешний
  # сервис увидит и это, и просто тишину. Пустой ALERT_DEADMAN_WEBHOOK_URL →
  # рендер вырезает webhook-блок (маркеры #@deadman), приёмник остаётся no-op
  # (как info-null): внешний контроль pending, Watchdog не спамит email.
  - name: deadman-webhook
    #@deadman-begin
    webhook_configs:
      - url: "${ALERT_DEADMAN_WEBHOOK_URL}"
        send_resolved: true
    #@deadman-end

  # Info — заглушка (drop). Удобно для storage-growth-алертов.
  - name: info-null

# Inhibition — подавление «дочерних» алертов, когда родительский firing.
# Пример: если PortalBackendDown — гасим PortalHighErrorRate/PortalHighLatencyP99
# (они не имеют смысла без живого бэкенда).
inhibit_rules:
  - source_matchers:
      - alertname = PortalBackendDown
    target_matchers:
      - service = portal-backend
    equal: ["service"]

  # Сертификат < 3 дней: critical гасит warning-дубль по тому же домену —
  # без inhibition при < 3 дней одновременно firing оба (Soon < 14 дней и
  # Critical < 3 дней), два письма об одном сертификате (аудит 2026-08).
  - source_matchers:
      - alertname = PortalCertExpiryCritical
    target_matchers:
      - alertname = PortalCertExpirySoon
    equal: ["target_name"]
