# Auto-provisioned dashboards for Grafana.
# Grafana сканирует `path` на наличие .json-файлов и импортирует их при старте.
# http://docs.grafana.org/administration/provisioning/#dashboards

apiVersion: 1

providers:
  - name: Portal dashboards
    orgId: 1
    folder: Portal              # папка в Grafana UI, куда складывать дашборды
    type: file
    disableDeletion: false      # true — запретить удаление через UI
    updateIntervalSeconds: 30   # проверять файлы на изменения раз в 30с
    allowUiUpdates: true        # правки из UI ДОПУСКАЮТСЯ, но живут только в БД Grafana —
                                # НЕ сохраняются обратно в JSON. При следующем изменении
                                # provisioning-файла (любой релиз) копия из БД будет молча
                                # перезаписана версией из файла. Постоянные правки — править
                                # monitoring/grafana/*.json в репо (аудит 2026-08).
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
