# Docker Compose overlay для observability-стека
# (Prometheus + Alertmanager + Grafana + Loki + Alloy).
#
# НЕ подключается автоматически к основному docker-compose.yml — это overlay,
# который поднимается явно через `-f`. Так тяжёлые образы (~900 МБ суммарно)
# не тащатся в базовый деплой портала.
#
# Запуск (полный observability-стек — метрики + логи + алерты + UI):
#   docker compose \
#     -f docker-compose.yml \
#     -f monitoring/docker-compose.monitoring.yml \
#     up -d prometheus alertmanager grafana loki alloy
#
# Запуск с scrape-токеном (если metrics_token задан в system.json):
#   PORTAL_METRICS_TOKEN="$(jq -r .metrics_token // empty system_data/settings/system.json)" \
#     docker compose \
#       -f docker-compose.yml \
#       -f monitoring/docker-compose.monitoring.yml \
#       up -d prometheus
#
# Сервисы подключаются к существующей сети `portal_internal` (объявлена в
# основном docker-compose.yml), поэтому видят `backend`, `redis`, `postgres`.
# Alloy дополнительно монтирует Docker socket (read-only) для discovery
# контейнеров и attach к их stdout/stderr.
#
# Volumes (данные переживают restart):
#   - prometheus-data      — TSDB (≈30 дней retention по умолчанию)
#   - alertmanager-data    — state алертов (silences, notifications)
#   - grafana-data         — пользователи, дашборды (правленные через UI)
#   - loki-data            — чанки логов (retention 30d, compactor чистит)
#
# UI (на хосте, проброшены на 127.0.0.1 — через SSH-туннель или reverse-proxy):
#   Prometheus :9090  Alertmanager :9093  Grafana :3001  Loki :3100  Alloy :12345

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: portal-prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=10GB"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"   # позволяет POST /-/reload без restart
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Только alert-rules (portal.yml), НЕ alertmanager.yml — это config
      # alertmanager-сервиса, для Prometheus это невалидный rules-файл.
      - ./monitoring/alerts/portal.yml:/etc/prometheus/rules/portal.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"               # 0.0.0.0 — для доступа из Windows в WSL2
    environment:
      # Подставляется в prometheus.yml::scrape_configs.authorization.credentials.
      # Пустая строка → /metrics открыт (закрытый периметр/VPN).
      PORTAL_METRICS_TOKEN: ${PORTAL_METRICS_TOKEN:-}
    networks:
      - internal
      - external
    logging: &default-logging
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: portal-alertmanager
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    # SMTP-параметры для email-receivers (см. alertmanager.yml). Пустые по
    # умолчанию → алерты видны только в UI, без доставки. Задать в .env.
    environment:
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
      ALERT_SMTP_PORT: ${ALERT_SMTP_PORT:-25}
      ALERT_SMTP_FROM: ${ALERT_SMTP_FROM:-portal-alerts@localhost}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
      ALERT_ADMINS_EMAIL: ${ALERT_ADMINS_EMAIL:-}
    volumes:
      - ./monitoring/alerts/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"               # 0.0.0.0 — доступ из Windows в WSL2
    networks:
      - internal
      - external
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.2.0
    container_name: portal-grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # Первый запуск: admin/admin, Grafana сама требует сменить при первом входе.
      # OAuth/auth-proxy — через runtime-настройки Grafana, не через env.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3001"
      GF_INSTALL_PLUGINS: ""
    volumes:
      # Provisioning — datasources и dashboards загружаются при старте.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/portal-overview.json:/var/lib/grafana/dashboards/portal-overview.json:ro
      - ./monitoring/grafana/portal-logs.json:/var/lib/grafana/dashboards/portal-logs.json:ro
      - ./monitoring/grafana/portal-infrastructure.json:/var/lib/grafana/dashboards/portal-infrastructure.json:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"               # 0.0.0.0 — доступ из Windows в WSL2
    networks:
      - internal
      - external
    logging: *default-logging

  # ---------------------------------------------------------------------
  # Loki — централизованное хранилище логов. Приём push от Alloy на :3100.
  # Single-binary (monolith) — достаточно для ~300 сотрудников. Retention 30d.
  # ---------------------------------------------------------------------
  loki:
    image: grafana/loki:3.7.3
    container_name: portal-loki
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - "-config.file=/etc/loki/config.yml"
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"               # 0.0.0.0 — доступ из Windows в WSL2 (обычно через Grafana)
    # NB: с Loki 3.6.0 busybox убран из образа — wget/curl недоступны,
    # встроенный HTTP-healthcheck (/ready) сделать нечем (upstream issue
    # grafana/loki#20149). Готовность обеспечивается restart: unless-stopped;
    # ручная проверка: curl http://localhost:3100/ready с хоста.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    networks:
      - internal
      - external
    logging: *default-logging

  # ---------------------------------------------------------------------
  # Alloy — сборщик логов. Discovery через Docker socket, attach к stdout/
  # stderr контейнеров portal-*, push в Loki. Заменяет Promtail (maintenance).
  # ---------------------------------------------------------------------
  alloy:
    image: grafana/alloy:v1.18.0
    container_name: portal-alloy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - "run"
      - "/etc/alloy/config.alloy"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--stability.level=generally-available"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Docker socket — discovery контейнеров + attach к stdout/stderr.
      # Read-only: discovery + attach работают на чтение; alloy не управляет
      # контейнерами (не start/stop), только читает логи.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345"             # 0.0.0.0 — Alloy UI (inspect pipeline, debugging)
    depends_on:
      - loki    # без service_healthy — у Loki нет встроенного healthcheck (см. выше)
    # NB: образ alloy не содержит wget/curl (upstream #477) — встроенный
    # healthcheck невозможен. Готовность: restart + ручная проверка
    # http://localhost:12345/-/ready с хоста.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    networks:
      - internal
      - external
    logging: *default-logging

  # ---------------------------------------------------------------------
  # Exporter'ы — инфраструктурные метрики (PostgreSQL, Redis, Host, Nginx).
  # Подключаются к portal_internal → видят postgres/redis/nginx по DNS.
  # Секреты (POSTGRES_PASSWORD, REDIS_PASSWORD) интерполируются из .env.
  # ---------------------------------------------------------------------

  # PostgreSQL exporter — пул соединений, cache hit ratio, XID wraparound,
  # размер БД, долгие транзакции, дедлоки.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: portal-postgres-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-portal}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-portal}?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - internal
      - external
    logging: *default-logging

  # Redis exporter — память/evictions, клиенты, keyspace hit rate, persistence.
  redis-exporter:
    image: oliver006/redis_exporter:v1.77.0
    container_name: portal-redis-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "9121:9121"
    networks:
      - internal
      - external
    logging: *default-logging

  # node_exporter — метрики хоста: диск (критично — /data/photos), CPU, RAM, load.
  # Bind-mount хостовых /proc /sys / через read-only — стандартный паттерн.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: portal-node-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - internal
      - external
    logging: *default-logging

  # Nginx exporter — active connections, request rate, reading/writing/waiting.
  # Скрейпит stub_status (см. nginx/templates/proxy_locations.conf.tmpl).
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.0
    container_name: portal-nginx-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - "-nginx.scrape-uri=http://nginx:80/stub_status"
    ports:
      - "9113:9113"
    networks:
      - internal
      - external
    logging: *default-logging

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:

networks:
  internal:
    external: true
    name: portal_internal
  external:
    external: true
    name: portal_external
