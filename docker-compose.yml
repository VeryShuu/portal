x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"
    tag: "{{.Name}}"

services:
  postgres:
    build:
      context: .
      dockerfile: postgres/Dockerfile
    image: ${IMAGE_PREFIX:-}portal-postgres:16
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portal}
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./base_data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portal} -d ${POSTGRES_DB:-portal}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - internal

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2 # pinned 2026-07-26
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - sh
      - -c
      - |
        case "$$REDIS_PASSWORD" in
          *[[:space:]]*|*[\<\>\|\&\;\"\`\$\\]*)
            echo "FATAL: REDIS_PASSWORD contains unsafe characters (whitespace or shell metacharacters)" >&2
            exit 1
            ;;
        esac
        printf 'user default on >%s ~* &* +@all\n' "$$REDIS_PASSWORD" > /tmp/redis.acl
        chmod 600 /tmp/redis.acl
        exec redis-server --aclfile /tmp/redis.acl --maxmemory "$${REDIS_MAXMEMORY:-256mb}" --maxmemory-policy volatile-lru --appendonly yes --appendfsync everysec
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-256mb}
    volumes:
      - ./base_data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - internal

  screenshot-service:
    build:
      context: ./screenshot-service
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX:-}portal-screenshot:${IMAGE_TAG:-latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      SCREENSHOT_SERVICE_SECRET: ${SCREENSHOT_SERVICE_SECRET:-}
      SCREENSHOT_ALLOWED_ORIGINS: ${SCREENSHOT_ALLOWED_ORIGINS:-}
      # Synthetic probe creds — local-auth login (для user-flow мониторинга).
      # Пусто → probe skip-ается (см. /probe endpoint).
      PROBE_ADMIN_EMAIL: ${PROBE_ADMIN_EMAIL:-}
      PROBE_ADMIN_PASSWORD: ${PROBE_ADMIN_PASSWORD:-}
      PROBE_FRONTEND_URL: ${PROBE_FRONTEND_URL:-http://frontend:80}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    healthcheck:
      # /ready (а не /health) — проверяет что Chromium стартовал и CDP-соединение
      # живое (audit [M20]). /health = liveness (процесс отвечает), не ловит
      # падение Playwright внутри процесса → compose мог считать контейнер
      # healthy при сломанном Chromium и backend получал 503 на все /pdf.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging
    networks:
      - internal

  migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: ${IMAGE_PREFIX:-}portal-backend:${IMAGE_TAG:-latest}
    restart: "no"
    command: ["/app/scripts/migrate.sh"]
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-portal}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-portal}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: ${IMAGE_PREFIX:-}portal-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-portal}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-portal}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SCREENSHOT_SERVICE_URL: http://screenshot-service:9000
      SCREENSHOT_SERVICE_SECRET: ${SCREENSHOT_SERVICE_SECRET:-}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    volumes:
      - ./upload_data/avatars:/data/avatars
      - ./upload_data/news_media:/data/news_media
      - ./upload_data/branding:/data/branding
      - ./upload_data/link_icons:/data/link_icons
      - ./upload_data/file_icons:/data/file-icons
      - ./upload_data/kb:/data/kb
      - ./upload_data/feedback:/data/feedback
      - ./upload_data/helpdesk:/data/helpdesk
      - ./upload_data/photos/originals:/data/photos/originals
      - ./upload_data/photos/thumbs:/data/photos/thumbs
      - ./upload_data/photos/zips:/data/photos/zips
      - ./system_data/settings:/data/settings
      - ./system_data/secrets:/data/secrets
      # Backend no longer writes nginx-conf files (handled by nginx-config sidecar);
      # only the reload-trigger directory is needed for the manual /admin/system/nginx/reload endpoint.
      - ./system_data/nginx_reload:/data/nginx
      - ./system_data/certs:/data/certs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      screenshot-service:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 60s
    logging: *default-logging
    networks:
      - internal
      - external

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: ${IMAGE_PREFIX:-}portal-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "arq", "app.worker.main.WorkerSettings"]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3g
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-portal}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-portal}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PHOTOS_THUMB_CONCURRENCY: ${PHOTOS_THUMB_CONCURRENCY:-2}
    volumes:
      - ./upload_data/avatars:/data/avatars
      - ./upload_data/news_media:/data/news_media
      - ./upload_data/branding:/data/branding
      - ./upload_data/link_icons:/data/link_icons
      - ./upload_data/file_icons:/data/file-icons
      - ./upload_data/kb:/data/kb
      - ./upload_data/feedback:/data/feedback
      - ./upload_data/helpdesk:/data/helpdesk
      - ./upload_data/photos/originals:/data/photos/originals
      - ./upload_data/photos/thumbs:/data/photos/thumbs
      - ./upload_data/photos/zips:/data/photos/zips
      - ./system_data/settings:/data/settings
      - ./system_data/secrets:/data/secrets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,sys,redis;r=redis.Redis.from_url(os.environ['REDIS_URL']);sys.exit(0 if r.ping() and r.exists('arq:heartbeat') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 120s
    logging: *default-logging
    networks:
      - internal
      - external

  nginx-config:
    build:
      context: ./nginx
      dockerfile: Dockerfile.config
    image: ${IMAGE_PREFIX:-}portal-nginx-config:${IMAGE_TAG:-latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 64m
    volumes:
      - ./system_data/settings:/data/settings:ro
      - ./system_data/certs:/data/certs:ro
      - ./system_data/nginx_conf:/data/nginx-conf
      - ./system_data/nginx_reload:/data/nginx
    healthcheck:
      test: ["CMD-SHELL", "test -s /data/nginx-conf/ssl_server.conf || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    networks:
      - internal

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    image: ${IMAGE_PREFIX:-}portal-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ 2>/dev/null | grep -q '<div id=\"app\">' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    networks:
      - internal

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX:-}portal-nginx:${IMAGE_TAG:-latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    entrypoint: ["/bin/sh", "/etc/nginx/entrypoint.sh"]
    volumes:
      - ./system_data/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./system_data/nginx/entrypoint.sh:/etc/nginx/entrypoint.sh:ro
      - ./system_data/nginx_conf:/data/nginx-conf
      - ./system_data/nginx_reload:/data/nginx
      - ./system_data/certs:/data/certs
      - ./upload_data/kb:/data/kb:ro
      - ./upload_data/feedback:/data/feedback:ro
      - ./upload_data/helpdesk:/data/helpdesk:ro
      - ./upload_data/photos/originals:/data/photos/originals:ro
      - ./upload_data/photos/thumbs:/data/photos/thumbs:ro
      - ./upload_data/photos/zips:/data/photos/zips:ro
      - ./upload_data/avatars:/data/avatars:ro
      - ./upload_data/news_media:/data/news_media:ro
      - ./upload_data/link_icons:/data/link_icons:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health 2>/dev/null | grep -q ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      nginx-config:
        condition: service_healthy
    logging: *default-logging
    networks:
      - internal
      - external

networks:
  internal:
    driver: bridge
    internal: true
  external:
    driver: bridge

volumes: {}
