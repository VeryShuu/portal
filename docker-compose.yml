x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"
    tag: "{{.Name}}"

services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: portal-postgres:16
    container_name: portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portal}
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./base_data/postgres:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portal} -d ${POSTGRES_DB:-portal}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: portal-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ./base_data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: portal-backend:latest
    container_name: portal-backend
    restart: unless-stopped
    env_file: .env
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - ./upload_data/avatars:/data/avatars
      - ./upload_data/news_media:/data/news_media
      - ./upload_data/branding:/data/branding
      - ./upload_data/link_icons:/data/link_icons
      - ./upload_data/kb:/data/kb
      - ./upload_data/photos/originals:/data/photos/originals
      - ./upload_data/photos/thumbs:/data/photos/thumbs
      - ./upload_data/photos/zips:/data/photos/zips
      - ./system_data/settings:/data/settings
      - ./system_data/secrets:/data/secrets
      - ./system_data/nginx_conf:/data/nginx-conf
      - ./system_data/nginx_reload:/data/nginx
      - ./system_data/certs:/data/certs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging
    networks:
      - internal
      - external

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: portal-backend:latest
    container_name: portal-worker
    restart: unless-stopped
    command: python -m arq app.worker.main.WorkerSettings
    env_file: .env
    volumes:
      - ./upload_data/avatars:/data/avatars
      - ./upload_data/news_media:/data/news_media
      - ./upload_data/branding:/data/branding
      - ./upload_data/link_icons:/data/link_icons
      - ./upload_data/kb:/data/kb
      - ./upload_data/photos/originals:/data/photos/originals
      - ./upload_data/photos/thumbs:/data/photos/thumbs
      - ./upload_data/photos/zips:/data/photos/zips
      - ./system_data/settings:/data/settings
      - ./system_data/secrets:/data/secrets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    networks:
      - internal
      - external

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: portal-frontend:latest
    container_name: portal-frontend
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    container_name: portal-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    entrypoint: ["/bin/sh", "/etc/nginx/entrypoint.sh"]
    volumes:
      - ./system_data/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./system_data/nginx/entrypoint.sh:/etc/nginx/entrypoint.sh:ro
      - ./system_data/nginx_conf:/data/nginx-conf
      - ./system_data/nginx_reload:/data/nginx
      - ./system_data/certs:/data/certs
      - ./upload_data/kb:/data/kb:ro
      - ./upload_data/photos/originals:/data/photos/originals:ro
      - ./upload_data/photos/thumbs:/data/photos/thumbs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health 2>/dev/null | grep -q ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    logging: *default-logging
    networks:
      - internal
      - external

networks:
  internal:
    driver: bridge
    internal: true
  external:
    driver: bridge

volumes: {}
