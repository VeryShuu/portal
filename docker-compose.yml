x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"
    tag: "{{.Name}}"

services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: portal-postgres:16
    container_name: portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portal}
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portal} -d ${POSTGRES_DB:-portal}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: portal-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: portal-backend:latest
    container_name: portal-backend
    restart: unless-stopped
    env_file: .env
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - ./avatars_data:/data/avatars
      - ./news_media_data:/data/news_media
      - ./branding_data:/data/branding
      - ./link_icons_data:/data/link_icons
      - ./settings_data:/data/settings
      - ./secrets_data:/data/secrets
      - ./kb_data:/data/kb
      - ./nginx_conf_data:/data/nginx-conf
      - ./nginx_reload_data:/data/nginx
      - ./certs_data:/data/certs
      - ./immich_cache_data:/data/cache/immich
      - ./peertube_cache_data:/data/cache/peertube
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging
    networks:
      - internal
      - external

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: portal-backend:latest
    container_name: portal-worker
    restart: unless-stopped
    command: python -m arq app.worker.main.WorkerSettings
    env_file: .env
    volumes:
      - ./avatars_data:/data/avatars
      - ./news_media_data:/data/news_media
      - ./branding_data:/data/branding
      - ./link_icons_data:/data/link_icons
      - ./settings_data:/data/settings
      - ./secrets_data:/data/secrets
      - ./kb_data:/data/kb
      - ./immich_cache_data:/data/cache/immich
      - ./peertube_cache_data:/data/cache/peertube
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    networks:
      - internal
      - external

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: portal-frontend:latest
    container_name: portal-frontend
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    container_name: portal-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    entrypoint: ["/bin/sh", "/etc/nginx/entrypoint.sh"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/entrypoint.sh:/etc/nginx/entrypoint.sh:ro
      - ./nginx_conf_data:/data/nginx-conf
      - ./nginx_reload_data:/data/nginx
      - ./certs_data:/data/certs
      - ./kb_data:/data/kb:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health 2>/dev/null | grep -q ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    logging: *default-logging
    networks:
      - internal
      - external

  immich-postgres:
    image: tensorchord/pgvecto-rs:pg16-v0.3.0
    container_name: portal-immich-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: immich
      POSTGRES_USER: immich
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - immich_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich -d immich"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - internal

  immich-redis:
    image: redis:7-alpine
    container_name: portal-immich-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - internal

  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: portal-immich-server
    restart: unless-stopped
    environment:
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
      UPLOAD_LOCATION: /usr/src/app/upload
      IMMICH_VERSION: ${IMMICH_VERSION:-release}
    volumes:
      - immich_upload_data:/usr/src/app/upload
    depends_on:
      immich-postgres:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2283/api/server/ping 2>/dev/null | grep -q pong || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging
    networks:
      - internal
      - external

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    container_name: portal-immich-ml
    restart: unless-stopped
    profiles: ["ml"]
    environment:
      IMMICH_VERSION: ${IMMICH_VERSION:-release}
    volumes:
      - immich_ml_cache:/cache
    logging: *default-logging
    networks:
      - internal

networks:
  internal:
    driver: bridge
    internal: true
  external:
    driver: bridge

volumes:
  immich_upload_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${IMMICH_UPLOAD_LOCATION:-./immich_upload_data}
  immich_pg_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./immich_pg_data
  immich_ml_cache: {}
