user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout  65;

    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        application/wasm;

    # Dynamic config from Admin UI (limits.conf, allowlist.conf)
    # Generated by backend on startup and when settings change.
    include /data/nginx-conf/*.conf;

    client_body_timeout  300s;

    # ── Docker internal DNS resolver (re-resolves on TTL) ───────
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── HTTP → HTTPS redirect ────────────────────────────────────
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS main server ────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name _;

        # TLS certificate managed via Admin UI → System → TLS
        # Files stored in /data/certs/ (shared volume with backend)
        ssl_certificate     /data/certs/portal.crt;
        ssl_certificate_key /data/certs/portal.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ── IP-ограничение (CIDR задаётся через Admin UI) ────────
        # $allowed_network определяется в /data/nginx-conf/allowlist.conf
        if ($allowed_network = 0) {
            return 403;
        }

        # ── Security headers ─────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header X-XSS-Protection          "0" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

        set $backend_host  "backend:8000";
        set $frontend_host "frontend:80";

        # ── Static media (avatars, news covers) ─────────────────
        location /media/ {
            proxy_pass         http://$backend_host;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_valid  200 7d;
            expires            7d;
        }

        # ── Backend API ──────────────────────────────────────────
        location /api/ {
            proxy_pass         http://$backend_host;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout  300s;
            proxy_send_timeout  300s;
        }

        # ── Health / Ready (публичные внутри сети) ───────────────
        location ~ ^/(health|ready)$ {
            proxy_pass         http://$backend_host;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # ── SSE: notifications/stream ────────────────────────────
        location /api/v1/notifications/stream {
            proxy_pass             http://$backend_host;
            proxy_http_version     1.1;
            proxy_set_header       Connection "";
            proxy_set_header       Host $host;
            proxy_set_header       X-Real-IP $remote_addr;
            proxy_read_timeout     3600s;
            proxy_buffering        off;
            proxy_cache            off;
            chunked_transfer_encoding on;
        }

        # ── Prometheus метрики (только из внутренней сети) ───────
        location /metrics {
            proxy_pass http://$backend_host;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── KB media (изображения в статьях) — internal only ───
        location /internal/kb-media/ {
            internal;
            alias /data/kb/media/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # ── KB files (вложения к статьям) — internal only ───────
        location /internal/kb-files/ {
            internal;
            alias /data/kb/files/;
            add_header Cache-Control "no-store";
        }

        # ── Frontend (Vue SPA) ───────────────────────────────────
        location / {
            proxy_pass         http://$frontend_host;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
    }
}
