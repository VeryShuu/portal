user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout  65;

    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        application/wasm;

    # ВНИМАНИЕ: nginx не поддерживает env-переменные в конфиге.
    # При изменении MAX_UPLOAD_SIZE_MB в .env — обновите значение ниже вручную и перезапустите nginx.
    # Значение должно совпадать с MAX_UPLOAD_SIZE_MB (по умолчанию 100m).
    client_max_body_size 100m;
    client_body_timeout  300s;

    # ── Ограничение доступа: только внутренняя сеть / VPN ──────
    # При изменении ALLOWED_CIDR в .env — обновите CIDR-список ниже вручную.
    # Значения должны совпадать с ALLOWED_CIDR (по умолчанию: RFC1918).
    geo $allowed_network {
        default         0;
        10.0.0.0/8      1;
        172.16.0.0/12   1;
        192.168.0.0/16  1;
        127.0.0.1       1;
    }

    # ── Docker internal DNS resolver (re-resolves on TTL) ───────
    # Важно: используем встроенный Docker DNS (127.0.0.11).
    # `valid=10s` — TTL кэша nginx. После рестарта backend новый IP
    # будет подхвачен автоматически в течение 10 сек БЕЗ reload nginx.
    #
    # NB: upstream { ... } + proxy_pass http://upstream — резолвит ОДИН раз
    # при старте и кэширует IP навсегда. Чтобы DNS перечитывался, используем
    # переменную в proxy_pass (см. ниже $backend_host/$frontend_host).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── HTTP → HTTPS redirect ────────────────────────────────────
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS main server ────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name portal.company.local;

        ssl_certificate     /etc/nginx/certs/portal.crt;
        ssl_certificate_key /etc/nginx/certs/portal.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ── IP-ограничение ───────────────────────────────────────
        if ($allowed_network = 0) {
            return 403;
        }

        # ── Security headers ─────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header X-XSS-Protection          "0" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        # CSP: script-src без 'unsafe-eval' (тот был нужен только для dev-режима Vite).
        # style-src 'unsafe-inline' оставлен — Naive UI инжектит inline-стили через CSS-in-JS.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

        # Используем переменные, чтобы DNS резолвился через resolver
        # при каждом запросе (с TTL кэша), а не один раз при старте.
        set $backend_host  "backend:8000";
        set $frontend_host "frontend:80";

        # ── Static media (avatars, news covers) ─────────────────
        location /media/ {
            proxy_pass         http://$backend_host;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            expires            7d;
            add_header         Cache-Control "public, immutable";
        }

        # ── Backend API ──────────────────────────────────────────
        location /api/ {
            proxy_pass         http://$backend_host;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout  300s;
            proxy_send_timeout  300s;
        }

        # ── Health / Ready (публичные внутри сети) ───────────────
        location ~ ^/(health|ready)$ {
            proxy_pass         http://$backend_host;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # ── SSE: notifications/stream ────────────────────────────
        location /api/v1/notifications/stream {
            proxy_pass             http://$backend_host;
            proxy_http_version     1.1;
            proxy_set_header       Connection "";
            proxy_set_header       Host $host;
            proxy_set_header       X-Real-IP $remote_addr;
            proxy_read_timeout     3600s;
            proxy_buffering        off;
            proxy_cache            off;
            chunked_transfer_encoding on;
        }

        # ── Prometheus метрики (только из внутренней сети) ───────
        location /metrics {
            proxy_pass http://$backend_host;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── Frontend (Vue SPA) ───────────────────────────────────
        location / {
            proxy_pass         http://$frontend_host;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
    }
}
