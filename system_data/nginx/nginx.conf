user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json_combined;

    server_tokens off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout  65;

    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        application/wasm;

    # Dynamic config from Admin UI:
    #   limits.conf     — client_max_body_size
    #   allowlist.conf  — geo $allowed_network
    #   ssl_server.conf — HTTPS server block (empty when TLS not configured)
    include /data/nginx-conf/*.conf;

    client_body_timeout  300s;

    # Docker internal DNS resolver (re-resolves on TTL)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Client IP and protocol are always taken from the TCP connection.
    # Accepting X-Real-IP / X-Forwarded-Proto from clients would allow
    # rate-limit bypass by spoofing. If this nginx is deployed behind a
    # trusted upstream reverse proxy, add ngx_http_realip_module directives
    # (set_real_ip_from + real_ip_header) to restore original-IP forwarding.

    # ── HTTP server — redirect to HTTPS ─────────────────────────
    # All traffic is redirected to HTTPS except ACME challenges and /health.
    # If TLS is not yet configured, upload a certificate via Admin UI → System → TLS.
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }

        location = /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # IP-ограничение (CIDR задаётся через Admin UI → Система)
        # $allowed_network определяется в /data/nginx-conf/allowlist.conf
        if ($allowed_network = 0) {
            return 403;
        }

        return 301 https://$host$request_uri;
    }

}
