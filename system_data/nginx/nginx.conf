user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json_combined;

    server_tokens off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout  65;

    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        application/wasm;

    # Dynamic config from Admin UI:
    #   limits.conf     — client_max_body_size
    #   allowlist.conf  — geo $allowed_network
    #   ssl_server.conf — HTTPS server block (empty when TLS not configured)
    include /data/nginx-conf/*.conf;

    client_body_timeout  300s;

    # Docker internal DNS resolver (re-resolves on TTL)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # If an upstream reverse proxy sends X-Forwarded-Proto / X-Real-IP, honour them.
    # Falls back to $scheme / $remote_addr for direct access.
    map $http_x_forwarded_proto $real_proto {
        default     $scheme;
        "~^https?$" $http_x_forwarded_proto;
    }

    map $http_x_real_ip $real_client_ip {
        default  $remote_addr;
        "~^.+"   $http_x_real_ip;
    }

    # ── HTTP server (always active) ──────────────────────────────
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }

        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # IP-ограничение (CIDR задаётся через Admin UI → Система)
        # $allowed_network определяется в /data/nginx-conf/allowlist.conf
        if ($allowed_network = 0) {
            return 403;
        }

        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header X-XSS-Protection          "0" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; frame-src 'self' https:; media-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'" always;

        set $backend_host  "backend:8000";
        set $frontend_host "frontend:80";

        location /media/ {
            proxy_pass         http://$backend_host;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $real_client_ip;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $real_proto;
            expires            7d;
        }

        location /api/ {
            proxy_pass         http://$backend_host;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $real_client_ip;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $real_proto;

            proxy_read_timeout  300s;
            proxy_send_timeout  300s;
        }

        location ~ ^/(health|ready)$ {
            proxy_pass         http://$backend_host;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $real_client_ip;
        }

        location /api/v1/notifications/stream {
            proxy_pass             http://$backend_host;
            proxy_http_version     1.1;
            proxy_set_header       Connection "";
            proxy_set_header       Host $host;
            proxy_set_header       X-Real-IP $real_client_ip;
            proxy_read_timeout     3600s;
            proxy_buffering        off;
            proxy_cache            off;
            chunked_transfer_encoding on;
        }

        location /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
            proxy_pass http://$backend_host;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Server-to-server callback from Nextcloud richdocuments federation —
        # FederationService::getRemoteFileDetails posts here to fetch real
        # portal user names for Collabora cursors.
        location = /ocs/v2.php/apps/richdocuments/api/v1/federation {
            proxy_pass         http://$backend_host;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $real_client_ip;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $real_proto;
        }

        location /internal/kb-media/ {
            internal;
            alias /data/kb/media/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        location /internal/kb-files/ {
            internal;
            alias /data/kb/files/;
            add_header Cache-Control "no-store";
        }

        location /internal/photos-thumbs/ {
            internal;
            alias /data/photos/thumbs/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        location /internal/photos-originals/ {
            internal;
            alias /data/photos/originals/;
            add_header Cache-Control "no-store";
            add_header X-Content-Type-Options "nosniff";
        }

        location / {
            proxy_pass         http://$frontend_host;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
    }

}
