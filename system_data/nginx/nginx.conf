worker_processes  auto;

error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Correlation id: prefer the client-supplied X-Request-Id (set by upstream
    # load balancer or the browser); fall back to nginx's own $request_id
    # (built-in 16-byte hex, available since nginx 1.11.0). The resulting
    # $req_id is forwarded to the backend (see proxy_locations.conf.tmpl) and
    # ends up in every structlog line via middleware/logging.py — tying
    # nginx-access and backend-request together end-to-end.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"request_id":"$req_id",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"}';

    # SSE-реконнекты (2xx) живут ~60 c и не несут пользы в access-логе/Loki —
    # это запись на каждую вкладку каждую минуту. Ошибки стрима (429-лимиты,
    # 499-обрывы, 5xx) логируются как обычно. Синхронно с исключением стрима
    # из latency-гистограммы — backend/app/middleware/metrics.py.
    map "$status:$request_uri" $access_log_skip_sse {
        ~^2[0-9][0-9]:/api/v1/notifications/stream  0;
        default                                     1;
    }

    access_log /dev/stdout json_combined if=$access_log_skip_sse;

    server_tokens off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout  65;

    # Rate limiting (audit M18): «турникет» на входе — защита от лавины
    # запросов (DoS / зацикленный клиент), пока backend её не увидел.
    # Учёт per-IP по $binary_remote_addr (TCP-адрес клиента; realip не
    # настроен намеренно — см. комментарий ниже, spoofing-защита).
    #   api  — все /api/: 30 r/s + burst 200 (щедрый старт; мониторить
    #          429 в Grafana неделю и при необходимости опускать);
    #   auth — /api/v1/auth/*: 30 r/m + burst 20 (НЕ 5 r/m из карточки
    #          аудита: фронт делает silent-refresh каждые 4 мин из КАЖДОЙ
    #          вкладки — 5 r/m душил бы восстановление multi-tab сессии).
    # limit_req_status 429: дефолтный 503 путался бы с ошибками backend;
    # 429 наблюдается панелью Grafana (Loki) + алертом NginxRateLimit429.
    limit_req_zone $binary_remote_addr zone=api:10m  rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
    # Публичный контур обучения (ADR-051): жёстче портал-зоны — brute-force
    # логина/восстановления внешних учёток из интернета.
    limit_req_zone $binary_remote_addr zone=learning_auth:10m rate=20r/m;
    limit_req_status 429;

    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path       /tmp/nginx/proxy_temp;
    fastcgi_temp_path     /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path       /tmp/nginx/uwsgi_temp;
    scgi_temp_path        /tmp/nginx/scgi_temp;

    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        application/wasm image/svg+xml font/ttf font/otf application/manifest+json;

    # Dynamic config from Admin UI:
    #   limits.conf     — client_max_body_size
    #   allowlist.conf  — geo $allowed_network
    #   ssl_server.conf — server block(s): HTTP-only or HTTP-redirect + HTTPS
    #                     generated by backend on startup and on cert upload/remove
    include /data/nginx-conf/*.conf;

    client_body_timeout  300s;

    # Docker internal DNS resolver (re-resolves on TTL)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Client IP and protocol are always taken from the TCP connection.
    # Accepting X-Real-IP / X-Forwarded-Proto from clients would allow
    # rate-limit bypass by spoofing. If this nginx is deployed behind a
    # trusted upstream reverse proxy, add ngx_http_realip_module directives
    # (set_real_ip_from + real_ip_header) to restore original-IP forwarding.

}
