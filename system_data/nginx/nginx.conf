user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Correlation id: prefer the client-supplied X-Request-Id (set by upstream
    # load balancer or the browser); fall back to nginx's own $request_id
    # (built-in 16-byte hex, available since nginx 1.11.0). The resulting
    # $req_id is forwarded to the backend (see proxy_locations.conf.tmpl) and
    # ends up in every structlog line via middleware/logging.py — tying
    # nginx-access and backend-request together end-to-end.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"request_id":"$req_id",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json_combined;

    server_tokens off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout  65;

    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        application/wasm image/svg+xml font/ttf font/otf application/manifest+json;

    # Dynamic config from Admin UI:
    #   limits.conf     — client_max_body_size
    #   allowlist.conf  — geo $allowed_network
    #   ssl_server.conf — server block(s): HTTP-only or HTTP-redirect + HTTPS
    #                     generated by backend on startup and on cert upload/remove
    include /data/nginx-conf/*.conf;

    client_body_timeout  300s;

    # Docker internal DNS resolver (re-resolves on TTL)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Client IP and protocol are always taken from the TCP connection.
    # Accepting X-Real-IP / X-Forwarded-Proto from clients would allow
    # rate-limit bypass by spoofing. If this nginx is deployed behind a
    # trusted upstream reverse proxy, add ngx_http_realip_module directives
    # (set_real_ip_from + real_ip_header) to restore original-IP forwarding.

}
