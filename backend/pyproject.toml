[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portal-backend"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "httpx>=0.27.0",
    "redis[hiredis]>=5.0.0",
    "arq>=0.26.0",
    "structlog>=24.1.0",
    "sentry-sdk[fastapi]>=2.3.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "fastapi-limiter==0.1.6",
    "bleach>=6.1.0",
    "python-magic>=0.4.27",
    "playwright>=1.44.0",
    "python-docx>=1.1.0",
    "markdown-it-py>=3.0.0",
    "aiosmtplib>=3.0.0",
    "python-multipart>=0.0.9",
    "orjson>=3.10.0",
    "python-dateutil>=2.9.0",
    "markdownify>=0.13.0",
    "aiofiles>=23.2.0",
]

[project.optional-dependencies]
prod = []
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "pytest-randomly>=3.15.0",
    "pytest-mock>=3.14.0",
    "testcontainers[postgres,redis]>=4.7.0",
    "httpx>=0.27.0",
    "fakeredis>=2.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-bleach>=6.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
filterwarnings = [
    "error::DeprecationWarning",
    # SQLAlchemy 2.x пока шумит на legacy-импортах в тестовых стабах:
    "ignore:.*declarative_base.*:DeprecationWarning",
    # asyncio default loop policy in Python 3.12+:
    "ignore:.*event_loop fixture.*:DeprecationWarning",
    # bleach использует html5lib с устаревшими warnings внутри:
    "ignore::DeprecationWarning:bleach.*",
    "ignore::DeprecationWarning:html5lib.*",
    "ignore::DeprecationWarning:passlib.*",
]
markers = [
    "integration: tests requiring real PG and/or Redis",
    "security: CSRF / XSS / headers / rate-limit",
    "slow: tests that take >1s",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "migrations/*", "app/worker/*"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
fail_under = 70
show_missing = true
skip_covered = false
