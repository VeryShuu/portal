[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portal-backend"
version = "1.0.0"
description = "Portal — корпоративный интранет-портал (FastAPI backend)"
license = { text = "MIT" }
authors = [{ name = "Reydan" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Framework :: FastAPI",
    "Private :: Do Not Upload",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "PyJWT[crypto]>=2.9.0",
    "bcrypt>=4.0.0",
    "httpx>=0.27.0",
    "redis[hiredis]>=5.0.0",
    "arq>=0.26.0",
    "structlog>=24.1.0",
    "sentry-sdk[fastapi]>=2.3.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "fastapi-limiter==0.1.6",
    "nh3>=0.2.14",
    "python-magic>=0.4.27",
    "python-docx>=1.1.0",
    "markdown-it-py>=3.0.0",
    "aiosmtplib>=3.0.0",
    "python-multipart>=0.0.9",
    "orjson>=3.10.0",
    "python-dateutil>=2.9.0",
    "markdownify>=0.13.0",
    "aiofiles>=23.2.0",
    "Pillow>=10.3.0",
    "pillow-heif>=0.16.0",
    "defusedxml>=0.7.1",
    "tzdata>=2024.1",
]

[project.urls]
Homepage = "https://github.com/VeryShuu/portal"
Repository = "https://github.com/VeryShuu/portal"
Issues = "https://github.com/VeryShuu/portal/issues"

[project.optional-dependencies]
prod = []
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "pytest-randomly>=3.15.0",
    "pytest-mock>=3.14.0",
    "testcontainers[postgres,redis]>=4.7.0",
    "httpx>=0.27.0",
    "fakeredis>=2.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001-003 — false positives на кириллицу (мы пишем доки и сообщения по-русски).
# B008 — стандартный паттерн FastAPI (Depends/Query в default).
# E501 — длинные строки часто оправданы (логи, SQL, шаблоны email);
#        для таких файлов — точечный per-file-ignore ниже, остальное wrap'ится вручную.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# main.py: settings нужны до импортов роутеров для configure_logging — by design.
"app/main.py" = ["E402"]
# worker/main.py: то же + ARQ functions/cron_jobs — стандартный mutable class default.
"app/worker/main.py" = ["E402", "RUF012"]
# email-шаблоны и длинные SQL/логи в задачах — не разбиваем построчно.
"app/worker/tasks/notifications.py" = ["E501"]
"app/worker/tasks/news.py" = ["E501"]
"app/worker/tasks/audit.py" = ["E501"]
"app/worker/tasks/photos.py" = ["E501"]
"app/api/branding.py" = ["E501"]
# Крупные API-модули: handler-сигнатуры (много Depends/Query/Body),
# structured-log dict'ы и SQL-фрагменты часто переваливают за 100. Wrap не улучшает читаемость.
"app/api/photos/*.py" = ["E501"]
"app/api/kb.py" = ["E501"]
"app/api/news.py" = ["E501"]
"app/api/files.py" = ["E501"]
# alembic-миграции — длинные DDL/SQL + Alembic-шаблон с устаревшим typing.
"migrations/*" = ["E501", "E402", "UP007", "UP035", "I001", "F401", "E401", "SIM108"]
# tests — допускаем utility-shortcut'ы (l/dest, неиспользуемые fixture'ы, длинные id, blind except).
"tests/*" = [
    "E501", "E402", "F401", "F811", "F841", "E741", "I001",
    "B017", "B018", "N806", "SIM105", "SIM108", "SIM117",
    "RUF021", "RUF059",
]
# Утилиты CLI и одноразовые скрипты — длинные строки и нестандартные имена допустимы.
"scripts/*" = ["E501", "N813"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
    "app.api.news",
    "app.api.links",
    "app.api.bookmarks",
    "app.api.users",
    "app.api.health",
    "app.api.kb",
    "app.api.kb_extra",
    "app.api.photos.photos",
    "app.api.photos.import_scan",
]
disable_error_code = ["return-value", "arg-type"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
filterwarnings = [
    "error::DeprecationWarning",
    # SQLAlchemy 2.x пока шумит на legacy-импортах в тестовых стабах:
    "ignore:.*declarative_base.*:DeprecationWarning",
    # asyncio default loop policy in Python 3.12+:
    "ignore:.*event_loop fixture.*:DeprecationWarning",
    "ignore::DeprecationWarning:passlib.*",
    # testcontainers core triggers DeprecationWarning at import time:
    "ignore::DeprecationWarning:testcontainers.*",
]
markers = [
    "integration: tests requiring real PG and/or Redis",
    "security: CSRF / XSS / headers / rate-limit",
    "slow: tests that take >1s",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "tests/*",
    "migrations/*",
    "app/worker/main.py",
    "app/worker/tasks/news.py",
    "app/worker/tasks/notifications.py",
    "app/worker/tasks/photos.py",
    "app/worker/tasks/files.py",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
fail_under = 70
show_missing = true
skip_covered = false
