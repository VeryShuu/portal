[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portal-backend"
version = "1.0.0"
description = "Portal — корпоративный интранет-портал (FastAPI backend)"
license = { text = "MIT" }
authors = [{ name = "VeryShuu" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Framework :: FastAPI",
    "Private :: Do Not Upload",
]

dependencies = [
    "fastapi>=0.115.0,<0.137.0",
    "starlette>=0.46.0,<1.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "PyJWT[crypto]>=2.9.0",
    "bcrypt>=4.0.0",
    "httpx>=0.27.0",
    "redis[hiredis]>=5.0.0",
    "arq>=0.26.0",
    "structlog>=24.1.0",
    "sentry-sdk[fastapi]>=2.3.0",
    "prometheus-fastapi-instrumentator>=7.0.0,<8.0",
    "fastapi-limiter==0.1.6",
    "nh3>=0.2.14",
    "python-magic>=0.4.27",
    "python-docx>=1.1.0",
    "markdown-it-py>=3.0.0",
    "aiosmtplib>=3.0.0",
    "python-multipart>=0.0.9",
    "orjson>=3.10.0",
    "python-dateutil>=2.9.0",
    "markdownify>=0.13.0",
    "aiofiles>=23.2.0",
    "openpyxl>=3.1.0",
    "Pillow>=10.3.0",
    "pillow-heif>=0.16.0",
    "blurhash>=1.1.4",
    "defusedxml>=0.7.1",
    "tzdata>=2024.1",
    "icalendar>=5.0.0",
    "aioimaplib>=1.0.1",
    "cryptography>=42.0.0",
]

[project.urls]
Homepage = "https://github.com/VeryShuu/portal"
Repository = "https://github.com/VeryShuu/portal"
Issues = "https://github.com/VeryShuu/portal/issues"

[project.optional-dependencies]
prod = []
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "pytest-randomly>=3.15.0",
    "pytest-mock>=3.14.0",
    "pytest-rerunfailures>=14.0",
    "polyfactory>=2.18.0",
    "testcontainers[postgres,redis]>=4.7.0",
    "httpx>=0.27.0",
    "fakeredis>=2.23.0",
    "ruff>=0.15,<0.16",
    "mypy>=1.10.0",
    "radon>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001-003 — false positives на кириллицу (мы пишем доки и сообщения по-русски).
# B008 — стандартный паттерн FastAPI (Depends/Query в default).
# E501 — длинные строки часто оправданы (логи, SQL, шаблоны email);
#        для таких файлов — точечный per-file-ignore ниже, остальное wrap'ится вручную.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# main.py: settings нужны до импортов роутеров для configure_logging — by design.
"app/main.py" = ["E402"]
# worker/main.py: то же + ARQ functions/cron_jobs — стандартный mutable class default.
"app/worker/main.py" = ["E402", "RUF012"]
# email-шаблоны и длинные SQL/логи в задачах — не разбиваем построчно.
"app/worker/tasks/notifications.py" = ["E501"]
"app/worker/tasks/news.py" = ["E501"]
"app/worker/tasks/audit.py" = ["E501"]
"app/worker/tasks/photos.py" = ["E501"]
# email_settings: длинный HTML-шаблон тестового письма (перенесён из api/branding).
"app/services/email_settings.py" = ["E501"]
# Крупные API-модули: handler-сигнатуры (много Depends/Query/Body),
# structured-log dict'ы и SQL-фрагменты часто переваливают за 100. Wrap не улучшает читаемость.
"app/api/photos/*.py" = ["E501"]
"app/api/kb/*.py" = ["E501"]
"app/api/news/*.py" = ["E501"]
"app/api/files/*.py" = ["E501"]
"app/api/users/*.py" = ["E501"]
"app/api/email_outbox.py" = ["E501"]
# Модели: длинные `Column(...)`/`Mapped[...]` объявления — wrap ухудшает читаемость DDL.
"app/models/*.py" = ["E501"]
# Длинные строки в email/ical-шаблонах и SQL-fragments.
"app/services/meetings/notifications.py" = ["E501"]
"app/services/news/email_share.py" = ["E501"]
"app/services/photos_acl.py" = ["E501"]
"app/worker/tasks/photos/zip_jobs.py" = ["E501"]
# alembic-миграции — длинные DDL/SQL; import-sort и F401 не требуются в auto-generated файлах.
"migrations/*" = ["E501", "E402", "I001", "F401", "E401", "SIM108"]
# tests — допускаем длинные строки и late-import'ы.
# TODO(REVIEW-5.2): постепенно сокращать список. Уже снято: `F401`, `F811`, `F841`,
# `B018`, `E741`, `SIM105`, `SIM108`, `RUF059`, `B017`, `N806`, `SIM117`.
"tests/*" = ["E501", "E402"]
# Утилиты CLI и одноразовые скрипты — длинные строки и нестандартные имена допустимы.
"scripts/*" = ["E501", "N813"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
    "app.models.*",
    "app.schemas.*",
    "app.utils.*",
    "app.api.*",
    "app.api.feedback.*",
    "app.api.files.*",
    "app.api.kb.*",
    "app.api.news.*",
    "app.api.photos.*",
    "app.api.users.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
strict_optional = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = [
    "app.core.*",
    "app.main",
    "app.middleware.*",
    "app.services.*",
    "app.worker.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
strict_optional = true
no_implicit_reexport = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
filterwarnings = [
    "error::DeprecationWarning",
    # SQLAlchemy 2.x пока шумит на legacy-импортах в тестовых стабах:
    "ignore:.*declarative_base.*:DeprecationWarning",
    "ignore::DeprecationWarning:passlib.*",
    # testcontainers core triggers DeprecationWarning at import time:
    "ignore::DeprecationWarning:testcontainers.*",
    # Любые RuntimeWarning из приложения — ошибка (поможет ловить корутины-без-await
    # и подобные ошибки моков в продовом коде).
    "error::RuntimeWarning:app.*",
]
markers = [
    "integration: tests requiring real PG and/or Redis",
    "security: CSRF / XSS / headers / rate-limit",
    "slow: tests that take >1s",
    "nightly: heavy/slow checks run only in the nightly CI job; auto-skipped without NIGHTLY=true",
    "unit_with_db: unit-style test that nevertheless needs real PG (REVIEW-2.1 migration path); auto-skipped without INTEGRATION_DB=true; reuses real_db_session fixture from tests/db_fixtures.py",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "tests/*",
    "migrations/*",
    "app/worker/main.py",
]
branch = true
parallel = true
relative_files = true

[tool.coverage.paths]
source = [
    "app",
    "*/backend/app",
    "/home/runner/work/*/backend/app",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
fail_under = 75
show_missing = true
skip_covered = false
