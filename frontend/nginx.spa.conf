server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "DENY" always;
    add_header X-XSS-Protection        "0" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options  "nosniff" always;
        add_header X-Frame-Options         "DENY" always;
        add_header X-XSS-Protection        "0" always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    }

    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp|avif|webmanifest)$ {
        # Some legacy/broken UAs (e.g. YaBrowser 23.x) emit a CORS preflight
        # (OPTIONS) for same-origin static assets. nginx answers 405 by default
        # for static files on non-GET methods, which only pollutes access logs.
        # These assets are same-origin → no preflight is needed; answer 204 and
        # skip the 405 noise. GET/HEAD keep serving cached files as before.
        if ($request_method = OPTIONS) {
            return 204;
        }
        expires 1y;
        add_header Cache-Control          "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
