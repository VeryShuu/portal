name: nightly-security
# Переведено с GitHub Actions → Forgejo Actions. actions/* берутся из
# https://code.forgejo.org/actions/* (SHA-pins сохранены). См. docs/forgejo-runner-setup.md.
# Образы инструментов (gitleaks/trivy/zaproxy) и базовый act-образ — зеркала в
# собственном registry forgejo.mage.ru/mage/*: ghcr.io с раннера недостижим
# (DNS SERVFAIL + evicted после prune, инцидент 2026-08-24 — прогоны #829-831).
# Обслуживание зеркал — docs/forgejo-runner-setup.md §«Зеркало ghcr-образов».


on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap-baseline:
    name: security / OWASP ZAP baseline
    runs-on: [ubuntu-latest, ci-services]
    timeout-minutes: 30
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: https://code.forgejo.org/actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (dev)
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Set isolated service scope
        run: |
          scope="portal-nightly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-zap"
          printf '%s\n' "CI_SCOPE=${scope}" "PG_CONTAINER=${scope}-pg" \
            "REDIS_CONTAINER=${scope}-redis" \
            "POSTGRES_IMAGE=portal-postgres:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-zap" \
            >> "$GITHUB_ENV"

      - name: Build postgres image with hunspell
        run: docker build -t "$POSTGRES_IMAGE" -f postgres/Dockerfile .

      - name: Start postgres
        run: |
          docker run -d --name "$PG_CONTAINER" \
            --label portal.ci.managed=true --label "portal.ci.scope=$CI_SCOPE" \
            -e POSTGRES_USER=portal \
            -e POSTGRES_PASSWORD=portal \
            -e POSTGRES_DB=portal \
            -p 127.0.0.1::5432 "$POSTGRES_IMAGE"
          pg_port=$(docker port "$PG_CONTAINER" 5432/tcp | sed -E 's/.*:([0-9]+)$/\1/')
          echo "DATABASE_URL=postgresql+asyncpg://portal:portal@127.0.0.1:${pg_port}/portal" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if docker exec "$PG_CONTAINER" pg_isready -h 127.0.0.1 -p 5432 -U portal -d portal >/dev/null 2>&1; then
              echo "postgres is ready"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "postgres did not become ready in time" >&2
              docker logs "$PG_CONTAINER" || true
              exit 1
            fi
            sleep 1
          done

      - name: Start redis
        run: |
          docker run -d --name "$REDIS_CONTAINER" \
            --label portal.ci.managed=true --label "portal.ci.scope=$CI_SCOPE" \
            -p 127.0.0.1::6379 redis:7
          redis_port=$(docker port "$REDIS_CONTAINER" 6379/tcp | sed -E 's/.*:([0-9]+)$/\1/')
          echo "REDIS_URL=redis://127.0.0.1:${redis_port}/0" >> "$GITHUB_ENV"
          # fail-closed (аудит 2026-08-23, P2): прежний цикл `grep && break` после
          # 30 неудачных попыток заканчивался на `sleep` (exit 0) — зелёный шаг
          # при так и не поднявшемся Redis. Теперь без готовности — exit 1.
          for i in $(seq 1 30); do
            if docker exec "$REDIS_CONTAINER" redis-cli ping | grep -q PONG; then
              echo "redis is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "redis did not become ready in time" >&2
              docker logs "$REDIS_CONTAINER" || true
              exit 1
            fi
            sleep 1
          done

      - name: Alembic upgrade head
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-for-tests-only-not-used-anywhere-else-32+chars
          ENVIRONMENT: test
        run: alembic upgrade head

      - name: Start backend (uvicorn) in background
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-for-tests-only-not-used-anywhere-else-32+chars
          ENVIRONMENT: test
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: admin12345
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          echo $! > backend.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/docs >/dev/null 2>&1; then
              echo "backend up"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:8000/docs >/dev/null

      - name: Run ZAP baseline scan
        id: zap
        # audit [M21] — ZAP pinned по digest (не semver). ZAP не публикует свежие
        # semver-теги: последний 2.15.0 — октябрь 2024, дальше только weekly-релизы
        # через rolling :stable/:latest. Pin по digest даёт воспроизводимость без
        # заморозки правил (тот же паттерн, что postgres:16@sha256:… в postgres/Dockerfile).
        # ⚠️ Dependabot НЕ покрывает `docker pull` внутри run: | (только Dockerfiles/
        # compose + actions/* в workflow). С 2026-08-24 образ живёт в нашем зеркале
        # (ghcr.io с раннера недостижим): digest исходника зашит в тег зеркала.
        # Обновление (раз в месяц, по календарю — как restore-drill из [H12]),
        # С МАШИНЫ С ДОСТУПОМ К ghcr (dev-WSL):
        #   1) узнать новый digest :stable:
        #      TOKEN=$(curl -sS "https://ghcr.io/token?scope=repository:zaproxy/zaproxy:pull&service=ghcr.io" | jq -r .token)
        #      curl -sS -H "Authorization: Bearer $TOKEN" -I "https://ghcr.io/v2/zaproxy/zaproxy/manifests/stable" \
        #        -H "Accept: application/vnd.oci.image.index.v1+json" | grep -i docker-content-digest
        #   2) пере-зеркалировать и обновить тег ниже (первые 8 символов digest):
        #      docker pull ghcr.io/zaproxy/zaproxy:stable@sha256:<NEW>
        #      docker tag <…> forgejo.mage.ru/mage/zaproxy:stable-<NEW8> && docker push <…>
        #      (подробности — docs/forgejo-runner-setup.md §«Зеркало ghcr-образов»)
        #
        # docker create → docker cp → docker start (как gitleaks/trivy в ci.yml):
        # act-runner работает в контейнере, host-docker-daemon не видит его
        # filesystem — bind-mount workspace оставлял ZAP без zap-baseline.conf
        # (три последних nightly-запуска красные именно из-за этого).
        # NB: docker cp пишет файлы от root — /zap/wrk создаёт сам пользователь
        # zap внутри контейнера (иначе Permission denied на запись отчётов),
        # конфиг кладём в существующий /zap (нужен только на чтение).
        run: |
          mkdir -p security/out
          # Аудит 2026-08-23 (P1.6) + review-2 (P1.3): прежний target — корень
          # backend — отдавал 404 (spider error, 3 URL). zap-baseline с seed
          # /openapi.json тоже НЕ доказывает покрытие: baseline — обычный
          # spider по HTML-ссылкам, официальный импорт OpenAPI выполняет
          # zap-api-scan.py -f openapi. -S — безопасный пассивный режим
          # (только passive-правила, без атак).
          curl -sf http://localhost:8000/openapi.json -o security/out/openapi-seed.json
          python3 - <<'PY'
          import json, sys
          spec = json.load(open("security/out/openapi-seed.json"))
          paths = len(spec.get("paths", {}))
          ops = sum(len(p.values()) for p in spec.get("paths", {}).values())
          print(f"openapi seed: {paths} paths / {ops} operations")
          if paths < 50:
              print("::error::OpenAPI-спека подозрительно мала — seed для ZAP не годится")
              sys.exit(1)
          PY
          # Зеркало ghcr.io/zaproxy/zaproxy:stable@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2
          # @sha256 — иммутабельный пин самого зеркала (аудит-3): digest исходника
          # зашит и в тег, и в reference — перезапись тега ничего не меняет.
          img="forgejo.mage.ru/mage/zaproxy:stable-8d387b1a@sha256:c558ee87358911ab17278c70991e856f57793e115d9cd0f88ca475cf82907a1a"
          cid=$(docker create --network host "$img" sh -c \
            'mkdir -p /zap/wrk && cd /zap/wrk && exec zap-api-scan.py \
              -t http://localhost:8000/openapi.json \
              -f openapi \
              -S \
              -c /zap/zap-baseline.conf \
              -r zap-report.html \
              -J zap-report.json \
              -I')
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp security/zap-baseline.conf "$cid:/zap/zap-baseline.conf"
          # Отчёты забираем cp из остановленного контейнера (bind-mount недоступен).
          # stdout сохраняем — его читает coverage sanity gate ниже (PIPESTATUS[0]
          # сохраняет exit code zap-api-scan, а не tee).
          set -o pipefail
          docker start -a "$cid" 2>&1 | tee security/out/zap-stdout.log
          rc=${PIPESTATUS[0]}
          docker cp "$cid:/zap/wrk/zap-report.json" security/out/zap-report.json || true
          docker cp "$cid:/zap/wrk/zap-report.html" security/out/zap-report.html || true
          exit "$rc"

      - name: ZAP coverage sanity gate
        # Аудит 2026-08-23 (P1.6) + review-2 (P1.3): сам по себе скан с -I
        # зелёный почти всегда — нужен fail-closed сигнал, что spider/импорт
        # реально добрался до API-поверхности (335 путей в спеке), а не
        # осмотрел три 404-страницы (прошлый прогон: «Total of 3 URLs»).
        # api-scan импортирует каждый endpoint спеки → URL'ов должно быть
        # >100. Формат сводки зафиксирован живым логом run #769.
        run: |
          log="security/out/zap-stdout.log"
          if [ ! -s "$log" ]; then
            echo "::error::stdout zap-api-scan не сохранён — coverage-гейт не может работать"
            exit 1
          fi
          python3 - "$log" <<'PY'
          import re, sys
          log = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          nums = [int(n) for n in re.findall(r"Total of (\d+) URL", log)]
          if not nums:
              print("::error::В stdout ZAP нет сводки 'Total of N URLs' — "
                    "скан не отчитался (формат вывода изменился или скан сломан)")
              sys.exit(1)
          total = max(nums)
          print(f"ZAP URLs discovered: {total}")
          if total < 100:
              print(f"::error::ZAP покрыл {total} URL (<100) при 335 путях в спеке — "
                    "импорт/обход API не состоялся; проверь zap-api-scan и seed")
              sys.exit(1)
          PY

      - name: Triage ZAP report
        id: triage
        if: always()
        run: |
          if [ ! -f security/out/zap-report.json ]; then
            echo "::error::ZAP завершился без JSON-отчёта; результаты сканирования недостоверны."
            exit 1
          fi
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, pathlib, os
          p = pathlib.Path("security/out/zap-report.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          counts = {"High": 0, "Medium": 0, "Low": 0, "Informational": 0}
          for site in data.get("site", []):
              for alert in site.get("alerts", []):
                  risk = alert.get("riskdesc", "").split(" ")[0]
                  counts[risk] = counts.get(risk, 0) + 1
          print("## ZAP baseline summary")
          print()
          print(f"- High: {counts['High']}")
          print(f"- Medium: {counts['Medium']}")
          print(f"- Low: {counts['Low']}")
          print(f"- Info: {counts['Informational']}")
          out = os.environ.get("GITHUB_OUTPUT")
          if out:
              with open(out, "a", encoding="utf-8") as fh:
                  fh.write(f"high={counts['High']}\n")
                  fh.write(f"medium={counts['Medium']}\n")
          PY

      - name: Upload ZAP reports
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1: Forgejo-compatible SHA pin
        with:
          name: zap-report
          path: security/out
          retention-days: 30

      - name: Dump backend log on failure
        if: failure()
        run: tail -200 backend/backend.log || true

      - name: Stop containers
        if: always()
        run: |
          [ -f backend/backend.pid ] && kill "$(cat backend/backend.pid)" || true
          docker rm -f "$PG_CONTAINER" "$REDIS_CONTAINER" || true

      - name: Fail if High-risk alerts found
        if: always() && steps.triage.outputs.high != '' && steps.triage.outputs.high != '0'
        run: |
          echo "::error::ZAP found ${{ steps.triage.outputs.high }} High-risk alert(s)."
          exit 1
