# OWASP ZAP baseline rule overrides
# Формат: <rule_id> <action> <comment>
# Действия: IGNORE | WARN | FAIL
#
# Применение:
#   docker run --rm -v $(pwd)/security:/zap/wrk/:rw -t ghcr.io/zaproxy/zaproxy:stable \
#     zap-baseline.py -t https://portal.staging.local \
#                     -c /zap/wrk/zap-baseline.conf \
#                     -r /zap/wrk/zap-report.html \
#                     -J /zap/wrk/zap-report.json

# Информационные предупреждения, которые не критичны для intranet-портала за VPN/IP-whitelist:
10015   IGNORE  Incomplete or No Cache-control - статика nginx уже отдаёт корректный Cache-Control
10027   IGNORE  Information Disclosure - Suspicious Comments - false positive в Vue SPA
10096   IGNORE  Timestamp Disclosure - Cookie expires; SameSite=Lax HTTPOnly уже выставлены
10109   IGNORE  Modern Web Application - Vue SPA, не классический server-rendered HTML

# Критичные правила (оставляем уровень FAIL по умолчанию):
# 10010 Cookie No HttpOnly Flag
# 10011 Cookie Without Secure Flag
# 10020 X-Frame-Options Header
# 10021 X-Content-Type-Options Header
# 10038 Content Security Policy Header Not Set
# 10049 Storable and Cacheable Content
# 10054 Cookie without SameSite Attribute
# 10055 CSP
# 10063 Permissions Policy
# 90033 Loosely Scoped Cookie
