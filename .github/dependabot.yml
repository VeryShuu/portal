# Dependabot — автоматические PR на обновление зависимостей и закрытие CVE.
# Док: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # --- Backend (Python) ---
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-minor-patch:
        update-types:
          - minor
          - patch

  # --- Screenshot-service (Python / requirements.txt) ---
  - package-ecosystem: pip
    directory: /screenshot-service
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: "chore(deps)"
    groups:
      screenshot-service-minor-patch:
        update-types:
          - minor
          - patch

  # --- Frontend (npm) ---
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch

  # --- GitHub Actions (версии экшенов в workflow) ---
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"

  # --- Docker base images (все Dockerfile проекта) ---
  # NOTE: nginx/Dockerfile.config не сканируется Dependabot (имя файла не
  # Dockerfile/*.dockerfile) — digest там обновляется вручную в lockstep с
  # monitoring/node-exporter-textfile (оба pin alpine:3.20). См. комментарий
  # в самом nginx/Dockerfile.config.
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /nginx
      - /postgres
      - /screenshot-service
      - /monitoring
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(docker)"

  # --- Docker compose (внешние base images в docker-compose.yml) ---
  # Сканирует docker-compose.yml в корне репо на предмет внешних тегов
  # (redis:7-alpine). portal-* образы исключены — они локально-собираемые
  # и пинятся через semver-tag, а не digest (ADR-047).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(docker)"
