name: nightly-flakes

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-flakes-${{ github.ref }}
  cancel-in-progress: true

# Workflow только читает код и аплоадит артефакт (тестовые логи) —
# дефолтные права сужаем до contents: read (principle of least privilege).
# Закрывает CodeQL actions/missing-workflow-permissions.
permissions:
  contents: read

jobs:
  flake-detect:
    name: backend / pytest 5x (flake detection)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend (dev)
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Build postgres image with hunspell
        run: docker build -t portal-postgres:16 -f postgres/Dockerfile .

      - name: Start postgres
        run: |
          docker run -d --name pg \
            -e POSTGRES_USER=portal \
            -e POSTGRES_PASSWORD=portal \
            -e POSTGRES_DB=portal \
            -p 5432:5432 \
            portal-postgres:16
          for i in $(seq 1 60); do
            if docker exec pg pg_isready -h 127.0.0.1 -p 5432 -U portal -d portal >/dev/null 2>&1; then
              echo "postgres is ready"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "postgres did not become ready in time" >&2
              docker logs pg || true
              exit 1
            fi
            sleep 1
          done

      - name: Start redis
        run: |
          docker run -d --name rd -p 6379:6379 redis:7
          for i in $(seq 1 30); do
            docker exec rd redis-cli ping | grep -q PONG && break
            sleep 1
          done

      - name: Alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://portal:portal@localhost:5432/portal
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-key-for-tests-only-not-used-anywhere-else-32+chars
          ENVIRONMENT: test
        run: alembic upgrade head

      - name: Run full suite 5 times, collect failure stats
        id: flakes
        working-directory: backend
        env:
          INTEGRATION_DB: "true"
          INTEGRATION_REDIS: "true"
          DATABASE_URL: postgresql+asyncpg://portal:portal@localhost:5432/portal
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-key-for-tests-only-not-used-anywhere-else-32+chars
          ENVIRONMENT: test
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: admin12345
        run: |
          set +e
          mkdir -p flake-reports
          : > flake-reports/all-failures.txt
          fail_runs=0
          for i in 1 2 3 4 5; do
            echo "::group::Run #$i"
            pytest tests/unit tests/security tests/integration \
              -p no:randomly -p no:cacheprovider \
              --no-cov -q \
              --junit-xml="flake-reports/run-${i}.xml" \
              -o "junit_suite_name=run-${i}" \
              | tee "flake-reports/run-${i}.log"
            rc=$?
            echo "Run #$i exit code: $rc"
            if [ "$rc" -ne 0 ]; then
              fail_runs=$((fail_runs+1))
              grep -E '^FAILED ' "flake-reports/run-${i}.log" \
                | awk '{print $2}' \
                >> flake-reports/all-failures.txt || true
            fi
            echo "::endgroup::"
          done

          {
            echo "## Flake detection summary"
            echo
            echo "Runs failed: ${fail_runs} / 5"
            echo
            if [ -s flake-reports/all-failures.txt ]; then
              echo "### Tests that failed in at least one run (count of fails):"
              echo
              echo '```'
              sort flake-reports/all-failures.txt | uniq -c | sort -rn
              echo '```'
            else
              echo "No failing tests detected across 5 runs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "fail_runs=${fail_runs}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload flake reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flake-reports
          path: backend/flake-reports/
          retention-days: 30

      - name: Stop containers
        if: always()
        run: docker rm -f pg rd || true
