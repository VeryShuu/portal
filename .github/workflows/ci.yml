name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: backend / ruff + mypy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend (dev)
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy
        run: mypy app

  backend-unit:
    name: backend / pytest unit + security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend (dev)
        run: pip install -e ".[dev]"
      - name: pytest unit + security (coverage gate)
        run: pytest tests/unit tests/security --cov=app --cov-report=term --cov-report=xml --cov-report=html --cov-fail-under=70
      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/htmlcov
            backend/coverage.xml
          retention-days: 14

  frontend-lint:
    name: frontend / eslint + tsc + i18n
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: gen:types
        run: npm run gen:types
      - name: eslint
        run: npm run lint:check
      - name: typecheck
        run: npm run typecheck
      - name: i18n keys
        run: npm run i18n:check

  frontend-unit:
    name: frontend / vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: vitest (with coverage gate)
        run: npm run test:coverage
      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 14

  backend-integration:
    name: backend / pytest integration (postgres + redis)
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (dev)
        working-directory: backend
        run: pip install -e ".[dev]"

      # Кастомный образ postgres:16 + hunspell-ru — нужен для FTS-тестов
      # (см. ./postgres/Dockerfile и ADR-018).
      - name: Build postgres image with hunspell
        run: docker build -t portal-postgres:ci ./postgres

      - name: Start postgres (with hunspell + init.sql)
        run: |
          docker run -d --name pg \
            -e POSTGRES_USER=portal \
            -e POSTGRES_PASSWORD=portal \
            -e POSTGRES_DB=portal \
            -p 5432:5432 \
            -v "${{ github.workspace }}/backend/migrations/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro" \
            portal-postgres:ci
          for i in $(seq 1 60); do
            docker exec pg pg_isready -U portal -d portal && break
            sleep 1
          done
          docker exec pg pg_isready -U portal -d portal

      - name: Start redis
        run: |
          docker run -d --name rd -p 6379:6379 redis:7
          for i in $(seq 1 30); do
            docker exec rd redis-cli ping | grep -q PONG && break
            sleep 1
          done
          docker exec rd redis-cli ping

      - name: Alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://portal:portal@localhost:5432/portal
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-key-for-tests-only-not-used-anywhere-else-32+chars
          ENVIRONMENT: test
        run: alembic upgrade head

      - name: pytest integration (-rs reports skipped)
        working-directory: backend
        env:
          INTEGRATION_DB: "true"
          INTEGRATION_REDIS: "true"
          DATABASE_URL: postgresql+asyncpg://portal:portal@localhost:5432/portal
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-key-for-tests-only-not-used-anywhere-else-32+chars
          ENVIRONMENT: test
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: admin12345
        run: pytest tests/integration -rs --no-cov

      - name: Dump postgres logs on failure
        if: failure()
        run: docker logs pg | tail -200

      - name: Stop containers
        if: always()
        run: |
          docker rm -f pg rd || true

  openapi-drift-check:
    name: openapi / drift check (committed vs generated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend (dev)
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Regenerate openapi.json
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/portal
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-key-for-openapi-export-only-not-used-anywhere-else-32+chars
          ENVIRONMENT: test
        run: python scripts/export_openapi.py --output ../openapi.json
      - name: Fail if openapi.json differs from committed
        run: |
          if ! git diff --quiet -- openapi.json; then
            echo "::error::openapi.json is out of date. Run:"
            echo "  cd backend && python scripts/export_openapi.py"
            echo "and commit the result."
            git --no-pager diff --stat -- openapi.json
            git --no-pager diff -- openapi.json | head -200
            exit 1
          fi
          echo "openapi.json is in sync with code."

  shellcheck:
    name: shellcheck / setup.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: shellcheck setup.sh
        run: shellcheck --severity=warning setup.sh
