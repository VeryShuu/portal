name: CI

on:
  push:
    branches: [main]
    # Semver-теги (v1.2.3) триггерят релизные сборки с доп. тегами :v1.2.3/:v1.2/:v1.
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Наименьшие привилегии по умолчанию для GITHUB_TOKEN.
# Отдельные job'ы (например, coverage-comment) расширяют права точечно.
permissions:
  contents: read

jobs:
  screenshot-unit:
    name: screenshot-service / pytest unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: screenshot-service
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: screenshot-service/requirements-dev.txt
      - name: Install dev deps
        # Только pytest — модуль под тестом (cookie_utils.py) не зависит от
        # aiohttp/playwright, поэтому heavyweight образ не нужен.
        run: pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest

  backend-lint:
    name: backend / ruff + mypy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend (dev)
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy
        run: mypy .

  backend-unit:
    name: backend / pytest unit + security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend (dev)
        run: pip install -e ".[dev]"
      - name: pytest unit + security (collect coverage, no gate here)
        env:
          COVERAGE_FILE: .coverage.unit
        run: pytest tests/unit tests/security --cov=app --cov-report= --cov-fail-under=0
      - name: Upload unit coverage data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-data-unit
          path: backend/.coverage.unit*
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  frontend-lint:
    name: frontend / eslint + tsc + i18n + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: gen:types
        run: npm run gen:types
      - name: eslint
        run: npm run lint:check
      - name: typecheck
        run: npm run typecheck
      - name: i18n keys
        run: npm run i18n:check
      - name: build (vite prod)
        run: npm run build

  frontend-unit:
    name: frontend / vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: vitest (with coverage gate)
        run: npm run test:coverage
      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 14

  backend-integration:
    name: backend / pytest integration (postgres + redis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-lint, backend-unit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (dev)
        working-directory: backend
        run: pip install -e ".[dev]"

      # Кастомный образ postgres:16 + hunspell-ru — нужен для FTS-тестов
      # (см. ./postgres/Dockerfile и ADR-046). init.sql запечён в образ,
      # поэтому отдельный -v не нужен.
      - name: Build postgres image with hunspell
        run: docker build -t portal-postgres:16 -f postgres/Dockerfile .

      - name: Start postgres (with hunspell + init.sql)
        run: |
          docker run -d --name pg \
            -e POSTGRES_USER=portal \
            -e POSTGRES_PASSWORD=portal \
            -e POSTGRES_DB=portal \
            -p 5432:5432 \
            portal-postgres:16
          for i in $(seq 1 60); do
            if docker exec pg pg_isready -h 127.0.0.1 -p 5432 -U portal -d portal >/dev/null 2>&1; then
              echo "postgres is ready"
              exit 0
            fi
            sleep 1
          done
          echo "postgres did not become ready in time" >&2
          docker logs pg || true
          exit 1

      - name: Start redis
        run: |
          docker run -d --name rd -p 6379:6379 redis:7
          for i in $(seq 1 30); do
            docker exec rd redis-cli ping | grep -q PONG && break
            sleep 1
          done
          docker exec rd redis-cli ping

      - name: Alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://portal:portal@localhost:5432/portal
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-key-for-tests-only-not-used-anywhere-else-32+chars
          ENVIRONMENT: test
        run: alembic upgrade head

      - name: pytest integration (-rs reports skipped, coverage collected)
        working-directory: backend
        env:
          INTEGRATION_DB: "true"
          INTEGRATION_REDIS: "true"
          DATABASE_URL: postgresql+asyncpg://portal:portal@localhost:5432/portal
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-key-for-tests-only-not-used-anywhere-else-32+chars
          ENVIRONMENT: test
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: admin12345
          COVERAGE_FILE: .coverage.integration
        run: |
          pytest tests/integration -rs \
            --cov=app --cov-report= --cov-fail-under=0 \
            --reruns 2 --reruns-delay 1 \
            --only-rerun "OperationalError|ConnectionRefusedError|ConnectionResetError|TimeoutError|asyncpg\\..*Error|redis\\.exceptions\\.ConnectionError"

      - name: Upload integration coverage data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-data-integration
          path: backend/.coverage.integration*
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: warn

      - name: Dump postgres logs on failure
        if: failure()
        run: docker logs pg | tail -200

      - name: Stop containers
        if: always()
        run: |
          docker rm -f pg rd || true

  backend-coverage:
    name: backend / merged coverage (unit + security + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-unit, backend-integration]
    if: always() && needs.backend-unit.result == 'success'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend (dev)
        run: pip install -e ".[dev]"
      - name: Download unit coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-data-unit
          path: backend/
      - name: Download integration coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-data-integration
          path: backend/
        continue-on-error: true
      - name: Combine coverage
        run: |
          ls -la .coverage.* || true
          coverage combine
          coverage report --skip-covered --show-missing
          coverage xml -o coverage.xml
          coverage html -d htmlcov
      - name: Enforce coverage gate (>=75%)
        run: coverage report --fail-under=75
      - name: Upload merged backend coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: |
            backend/htmlcov
            backend/coverage.xml
          retention-days: 14

  coverage-comment:
    name: coverage / PR summary comment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend-coverage, frontend-unit]
    # Только PR из того же репо (не из fork) — защита от fork-based
    # exfiltration coverage-данных через PR-comment. У fork-PR
    # github.event.pull_request.head.repo.full_name != github.repository.
    if: github.event_name == 'pull_request' && always() && needs.backend-coverage.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download backend coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: backend-coverage
          path: cov/backend
      - name: Download frontend coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-coverage
          path: cov/frontend
        continue-on-error: true
      - name: Generate coverage summary
        # Pinned by SHA (supply-chain hardening): floating tag @v1.3.0 можно
        # перезаписать компрометацией репо action'а. dependabot обновит SHA.
        # v1.3.0 — коммит 51cc3a756ddcd398d447c044c02cb6aa83fdae95
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95
        with:
          filename: cov/**/cobertura-coverage.xml,cov/**/coverage.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: "60 80"
      - name: Post coverage summary as PR comment
        # Pinned by SHA (supply-chain hardening): floating tag @v2 можно
        # перезаписать компрометацией репо action'а, а job имеет
        # pull-requests: write. dependabot обновит SHA.
        # v2.9.4 — коммит 773744901bac0e8cbb5a0dc842800d45e9b2b405
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        with:
          recreate: true
          path: code-coverage-results.md

  openapi-drift-check:
    name: openapi / drift check (committed vs generated)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend (dev)
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Regenerate openapi.json
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/portal
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-key-for-openapi-export-only-not-used-anywhere-else-32+chars
          ENVIRONMENT: test
        run: python scripts/export_openapi.py --output ../openapi.json
      - name: Fail if openapi.json differs from committed
        run: |
          if ! git diff --quiet -- openapi.json; then
            echo "::error::openapi.json is out of date. Run:"
            echo "  cd backend && python scripts/export_openapi.py"
            echo "and commit the result."
            git --no-pager diff --stat -- openapi.json
            git --no-pager diff -- openapi.json | head -200
            exit 1
          fi
          echo "openapi.json is in sync with code."

  fake-db-allowlist:
    name: backend / authed_client_factory allowlist (fake_db)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify no new tests outside allowlist use authed_client_factory
        working-directory: backend
        run: |
          # Список тестов, которым разрешено использовать authed_client_factory
          # (и тем самым no-op _fake_db). См. tests/conftest.py:authed_client_factory.
          mapfile -t allow < <(grep -v '^\s*\(#\|$\)' tests/fake_db_allowlist.txt)
          mapfile -t found < <(
            grep -rl "authed_client_factory" tests/unit tests/security \
              | sed -e 's|^backend/||' -e 's|^\./||' \
              | sort -u
          )
          # Файлы, найденные грепом, но отсутствующие в allowlist.
          unexpected=()
          for f in "${found[@]}"; do
            allowed=0
            for a in "${allow[@]}"; do
              if [ "$f" = "$a" ]; then allowed=1; break; fi
            done
            if [ "$allowed" -eq 0 ]; then unexpected+=("$f"); fi
          done
          # Файлы, перечисленные в allowlist, но больше не использующие фикстуру —
          # допустимо, выводим как информацию (не фейлим), чтобы allowlist можно
          # было постепенно сокращать.
          stale=()
          for a in "${allow[@]}"; do
            present=0
            for f in "${found[@]}"; do
              if [ "$f" = "$a" ]; then present=1; break; fi
            done
            if [ "$present" -eq 0 ]; then stale+=("$a"); fi
          done
          if [ ${#stale[@]} -gt 0 ]; then
            echo "::notice::tests/fake_db_allowlist.txt has stale entries (can be removed):"
            printf '  %s\n' "${stale[@]}"
          fi
          if [ ${#unexpected[@]} -gt 0 ]; then
            echo "::error::New tests use authed_client_factory (no-op _fake_db) but are not in tests/fake_db_allowlist.txt:"
            printf '  %s\n' "${unexpected[@]}"
            echo
            echo "Используйте integration-фикстуру real_db_session вместо authed_client_factory"
            echo "для бизнес-сценариев. Если это security-тест — оставьте в tests/security/."
            exit 1
          fi
          echo "OK: authed_client_factory usage matches allowlist."

  shellcheck:
    name: shellcheck / *.sh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: shellcheck all tracked *.sh
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No *.sh files tracked."
            exit 0
          fi
          printf 'Checking:\n'; printf '  %s\n' "${files[@]}"
          shellcheck --severity=warning "${files[@]}"

  quality-gates:
    name: quality / complexity + duplication + dead-code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend (dev)
        working-directory: backend
        run: pip install -e ".[dev]"

      # Complexity gate: блокирует любой rank-D/E/F (CC>10). После декомпозиции
      # трёх D-функций (audit 2026-07-20) в репозитории не осталось функций
      # хуже C — этот gate фиксирует планку и не даёт регрессии вернуться.
      # Уборка существующего долга делается через декомпозицию (не через
      # повышение порога гейта).
      - name: Complexity gate — no rank-D+ (CC>10) functions (backend)
        working-directory: backend
        run: |
          out="$(radon cc app -n D -s)"
          if [ -n "$out" ]; then
            echo "::error::Rank-D+ (CC>10) function(s) detected — refactor before merge:"
            echo "$out"
            exit 1
          fi
          echo "OK: no rank-D+ functions (all functions are C or better)."

      - name: npm ci (frontend)
        working-directory: frontend
        run: npm ci

      # Гейт дублей: текущая база ~2.72% дублированных строк; порог 4%
      # (см. frontend/.jscpd.json). Падает при росте дублирования сверх порога.
      - name: Duplication gate (jscpd, fail >4%)
        working-directory: frontend
        run: npx --yes jscpd@4.2.4

      # Мёртвый код: knip шумит на легитимных публичных хук/тип-экспортах
      # (ложноположительные), поэтому пока информационно (не блокирует мёрж).
      - name: Dead-code report (knip, informational)
        working-directory: frontend
        continue-on-error: true
        run: npx --yes knip@6.16.1 --no-config-hints

  frontend-types-drift:
    name: frontend / types.gen drift check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: Regenerate types.gen.d.ts
        run: npm run gen:types
      - name: Fail if types.gen.d.ts differs from committed
        run: |
          if ! git diff --quiet -- src/api/types.gen.d.ts; then
            echo "::error::frontend/src/api/types.gen.d.ts is out of date."
            echo "Run: (cd frontend && npm run gen:types) and commit the result."
            git --no-pager diff --stat -- src/api/types.gen.d.ts
            git --no-pager diff -- src/api/types.gen.d.ts | head -200
            exit 1
          fi
          echo "types.gen.d.ts is in sync with openapi.json."

  frontend-e2e:
    name: frontend / playwright e2e (chromium)
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-lint]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend (dev)
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Build postgres image with hunspell
        run: docker build -t portal-postgres:16 -f postgres/Dockerfile .

      - name: Start postgres
        run: |
          docker run -d --name pg \
            -e POSTGRES_USER=portal \
            -e POSTGRES_PASSWORD=portal \
            -e POSTGRES_DB=portal \
            -p 5432:5432 \
            portal-postgres:16
          for i in $(seq 1 60); do
            if docker exec pg pg_isready -h 127.0.0.1 -p 5432 -U portal -d portal >/dev/null 2>&1; then
              echo "postgres is ready"
              exit 0
            fi
            sleep 1
          done
          echo "postgres did not become ready in time" >&2
          docker logs pg || true
          exit 1

      - name: Start redis
        run: |
          docker run -d --name rd -p 6379:6379 redis:7
          for i in $(seq 1 30); do
            docker exec rd redis-cli ping | grep -q PONG && break
            sleep 1
          done

      - name: Alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://portal:portal@localhost:5432/portal
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-key-for-tests-only-not-used-anywhere-else-32+chars
          ENVIRONMENT: test
        run: alembic upgrade head

      - name: Start backend (uvicorn) in background
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://portal:portal@localhost:5432/portal
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-key-for-tests-only-not-used-anywhere-else-32+chars
          ENVIRONMENT: test
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: admin12345
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          echo $! > backend.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/v1/health >/dev/null 2>&1 \
               || curl -sf http://localhost:8000/health >/dev/null 2>&1 \
               || curl -sf http://localhost:8000/docs >/dev/null 2>&1; then
              echo "backend up"
              break
            fi
            sleep 1
          done

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: gen:types
        working-directory: frontend
        run: npm run gen:types

      - name: Install Playwright (chromium only)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright (chromium)
        working-directory: frontend
        env:
          CI: "true"
          E2E_MODE: dev
          VITE_API_TARGET: http://localhost:8000
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14

      - name: Dump backend log on failure
        if: failure()
        run: tail -200 backend/backend.log || true

      - name: Stop containers
        if: always()
        run: |
          [ -f backend/backend.pid ] && kill "$(cat backend/backend.pid)" || true
          docker rm -f pg rd || true

  compose-smoke:
    name: compose / up + healthcheck smoke
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-lint]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Prepare data directories
        run: |
          mkdir -p base_data/postgres base_data/redis
          mkdir -p upload_data/avatars upload_data/news_media upload_data/branding \
                   upload_data/link_icons upload_data/kb \
                   upload_data/photos/originals upload_data/photos/thumbs upload_data/photos/zips
          mkdir -p system_data/settings system_data/secrets system_data/nginx_conf \
                   system_data/nginx_reload system_data/certs

      - name: Generate minimal .env
        run: |
          cat >.env <<'EOF'
          POSTGRES_DB=portal
          POSTGRES_USER=portal
          POSTGRES_PASSWORD=portal_ci_smoke_pw
          REDIS_PASSWORD=redis_ci_smoke_pw
          REDIS_MAXMEMORY=128mb
          SECRET_KEY=compose-smoke-secret-key-not-used-anywhere-else-32+chars
          ENVIRONMENT=test
          ADMIN_EMAIL=admin@example.com
          ADMIN_PASSWORD=admin12345
          SCREENSHOT_SERVICE_SECRET=ci-screenshot-secret
          SCREENSHOT_ALLOWED_ORIGINS=http://localhost
          IMAGE_TAG=ci
          HTTP_PORT=8081
          HTTPS_PORT=8443
          EOF

      - name: Generate dev compose override
        run: bash setup.sh gen-dev-files

      - name: docker compose up (postgres + redis + migrations + backend)
        run: |
          # Retry the build/up: pulling the Playwright base image for
          # screenshot-service (a transitive depends_on of backend) from MCR
          # intermittently returns "403 Forbidden" on shared CI runner IPs.
          # The tag is not removed — it's a transient registry error — so a
          # short retry loop reliably recovers without changing the topology.
          for attempt in 1 2 3; do
            if docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build \
                 postgres redis migrations backend; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::docker compose up failed after 3 attempts"
              exit 1
            fi
            echo "compose up failed (attempt ${attempt}/3), retrying in 15s..."
            sleep 15
          done
          docker compose -f docker-compose.yml -f docker-compose.dev.yml ps

      - name: Wait for backend to become healthy
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8000/docs >/dev/null 2>&1; then
              echo "backend up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:8000/docs >/dev/null

      - name: Smoke — backend /docs returns 200
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/docs)
          [ "$code" = "200" ] || { echo "::error::/docs returned $code"; exit 1; }

      - name: Smoke — openapi.json reachable
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/openapi.json)
          [ "$code" = "200" ] || { echo "::error::/openapi.json returned $code"; exit 1; }

      - name: Smoke — unauthenticated API request returns 401/403
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/users/me)
          case "$code" in
            401|403) echo "OK: protected endpoint returned $code" ;;
            *) echo "::error::expected 401/403 for /api/v1/users/me, got $code"; exit 1 ;;
          esac

      - name: Dump compose logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --no-color --tail=300 || true

      - name: Tear down compose
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v --remove-orphans || true

  tests-generated-drift:
    name: docs / tests.generated.md drift check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend (dev)
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Regenerate docs/tests.generated.md
        env:
          DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/portal
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-key-for-tests-only-not-used-anywhere-else-32+chars
          ENVIRONMENT: test
        run: bash scripts/list_tests.sh
      - name: Fail if docs/tests.generated.md differs from committed
        run: |
          if ! git diff --quiet -- docs/tests.generated.md; then
            echo "::error::docs/tests.generated.md is out of date."
            echo "Run: bash scripts/list_tests.sh and commit the result."
            git --no-pager diff --stat -- docs/tests.generated.md
            git --no-pager diff -- docs/tests.generated.md | head -200
            exit 1
          fi
          echo "docs/tests.generated.md is in sync with tests."

  # ───────────────────────────────────────────────────────────────────────────
  # publish-images: сборка и пуш Docker-образов в GHCR (ghcr.io/veryshuu/*).
  # Запускается ТОЛЬКО на push в main или semver-tag (v*), НЕ на pull_request —
  # чтобы не пушить с PR-раннеров. Все образы билдятся параллельно через matrix.
  # Тегирование: всегда sha-<7симв> + latest; при push tag v1.2.3 → +v1.2.3/v1.2/v1.
  # См. ADR-045 (CI-built images in GHCR + pull-based deploy).
  # ───────────────────────────────────────────────────────────────────────────
  # ────────────────────────────────────────────────────────────────────────────
  # validate-release-tag — gate перед publish на тегах v* (ADR-047).
  #
  # Semver-lock прода: прод обязан пиниться к релизному тегу v1.2.3. Чтобы
  # оператор не мог протолкнуть в registry образ с некорректным тегом (v1.5,
  # v1.2.3-rc без номера, release-1 и т.п.), валидируем формат И привязку
  # тега к main ДО того, как publish-images запушит образы.
  #
  # Семантика needs: этот job skipped на main-push (if=только тег v*). Skipped
  # dependency считается success в always() && success(), поэтому publish-images
  # на main-push срабатывает как прежде. На теге v* — job обязан выполниться
  # и пройти, иначе publish не запустится.
  # ────────────────────────────────────────────────────────────────────────────
  validate-release-tag:
    name: validate / release tag (ADR-047)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Нужна история main, чтобы проверить, что тег на коммите из main.
          fetch-depth: 0

      - name: Validate semver format
        run: |
          set -euo pipefail
          ref_name="${GITHUB_REF_NAME:-}"
          # Допустимо: v1.2.3 или v1.2.3-rc1 (release candidate с номером).
          # Формат: v + X.Y.Z + опц. -rcN (N — номер). Согласовано с
          # scripts/release.sh (defense-in-depth).
          if [[ ! "$ref_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::Некорректный формат релизного тега: '${ref_name}'"
            echo "::error::Допустимо: v1.2.3 или v1.2.3-rc1 (semver X.Y.Z с опц. -rcN)"
            echo "::error::Используйте ./scripts/release.sh <version> — он валидирует до git tag."
            exit 1
          fi
          echo "✓ Semver format OK: ${ref_name}"

      - name: Verify tag is on a commit reachable from main
        # Защита от тегирования случайной feature-ветки. Тег обязан указывать
        # на коммит, который входит в историю main (включая сам HEAD main).
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA}"
          # git branch --contains показывает ветки, в истории которых есть коммит.
          # На CI пуш тега origin/main уже обновлён, поэтому проверка корректна.
          if ! git branch -r --contains "$sha" | grep -qE 'origin/main$'; then
            echo "::error::Тег ${GITHUB_REF_NAME} указывает на коммит ${sha:0:7},"
            echo "::error::который НЕ входит в историю origin/main. Релизить можно"
            echo "::error::только коммиты из main (см. scripts/release.sh)."
            exit 1
          fi
          echo "✓ Tag ${GITHUB_REF_NAME} → commit ${sha:0:7} (on main)"

  publish-images:
    name: publish / GHCR images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Публикуем только если весь gate-набор зелёный. always() — чтобы
    # смок- и юнит-задачи со status 'success' учитывались корректно даже
    # при последующих сбоях в зависимостях.
    # В набор входят ВСЕ критичные job'ы (ADR-045 §2): lint/unit/integration/
    # e2e/smoke. Без них образ с упавшими интеграционными/e2e ушёл бы в GHCR.
    # validate-release-tag добавлен для тегов v* (ADR-047): на main-push он
    # skipped (success), на теге v* — обязан пройти.
    needs:
      - backend-lint
      - backend-unit
      - backend-integration
      - frontend-lint
      - frontend-unit
      - frontend-e2e
      - compose-smoke
      - screenshot-unit
      - validate-release-tag
    # Не на PR: билдим и пушим только main-коммиты и релизные теги.
    if: github.event_name == 'push' && always() && success()
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # 6 уникальных образов. backend собирается один раз (target: production),
        # используется 3 сервисами (backend/worker/migrations) по одному имени.
        # context/file соответствуют docker-compose.yml: context — каталог сборки,
        # file — путь к Dockerfile от корня репозитория (НЕ относительно context,
        # таково API build-push-action).
        include:
          - image: portal-backend
            context: ./backend
            file: ./backend/Dockerfile
            target: production
          - image: portal-frontend
            context: .
            file: ./frontend/Dockerfile
            target: ""
          - image: portal-nginx
            context: ./nginx
            file: ./nginx/Dockerfile
            target: ""
          - image: portal-nginx-config
            context: ./nginx
            file: ./nginx/Dockerfile.config
            target: ""
          - image: portal-screenshot
            context: ./screenshot-service
            file: ./screenshot-service/Dockerfile
            target: ""
          - image: portal-postgres
            context: .
            file: ./postgres/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Compute image tags
        id: meta
        run: |
          # Полное имя образа в GHCR: ghcr.io/veryshuu/<image>.
          # Версия образа = major-версия PG для postgres, иначе IMAGE_TAG.
          registry="ghcr.io/veryshuu"
          short_sha="${GITHUB_SHA::7}"

          if [[ "${{ matrix.image }}" == "portal-postgres" ]]; then
            # postgres тегируется по major-версии (PG 16) — как в docker-compose.yml.
            full="${registry}/portal-postgres:16"
            tags="${full}"
            # При релизном tag — пере-тегируем latest-postgres16 не имеет смысла;
            # оставляем единственный :16 (rolling, всегда последний main).
          else
            # sha-тег — точная привязка к коммиту (для отката).
            sha_tag="${registry}/${{ matrix.image }}:sha-${short_sha}"
            # latest — указатель на HEAD main (continuous deploy).
            latest_tag="${registry}/${{ matrix.image }}:latest"
            tags="${sha_tag}"$'\n'"${latest_tag}"

            # При push semver-tag (v1.2.3) — добавляем :v1.2.3, :v1.2, :v1.
            ref="${GITHUB_REF#refs/tags/}"
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              ver="${ref#v}"
              tags="${tags}"$'\n'"${registry}/${{ matrix.image }}:v${ver}"
              # major.minor и major (если есть minor и patch части).
              if [[ "${ver}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                minor="${ver%.*}"
                major="${minor%.*}"
                tags="${tags}"$'\n'"${registry}/${{ matrix.image }}:v${minor}"
                tags="${tags}"$'\n'"${registry}/${{ matrix.image }}:v${major}"
              fi
            fi
          fi

          # Записываем теги как JSON-массив для build-push-action::tags (multiline → JSON).
          json_tags=$(printf '%s\n' "$tags" | jq -R . | jq -sc .)
          {
            echo "tags<<EOF"
            printf '%s\n' "$tags"
            echo "EOF"
            echo "tags_json=${json_tags}"
          } >> "$GITHUB_OUTPUT"
          echo "Computed tags for ${{ matrix.image }}:"
          printf '  %s\n' "$tags"

      - name: Set up Docker Buildx
        # Pinned by SHA (supply-chain hardening): v4.2.0 — коммит bb05f3f5.
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Log in to GHCR
        # Pinned by SHA (supply-chain hardening): v4.5.0 — коммит 06fb636f.
        # Встроенный GITHUB_TOKEN с packages: write — отдельный PAT не нужен.
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push ${{ matrix.image }}
        # Pinned by SHA (supply-chain hardening): v7.3.0 — коммит 53b7df96.
        # Floating tag @v7 можно перезаписать компрометацией репо action'а,
        # а job имеет packages: write. dependabot обновит SHA.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Кэш сборки между запусками (ускоряет с ~6 до ~2 мин на повторных сборках).
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # deploy-bundle — артефакт для prod-сервера без клона репозитория (ADR-046).
  #
  # На проде НЕ нужен полный git-клон: образы едут из GHCR (ADR-045), а всё
  # остальное (docker-compose.yml, .env.example, monitoring-overlay, setup.sh)
  # упаковывается в один tarball и аттачится к релизу. Флоу на проде:
  #     gh release download v1.2.3 -p 'portal-deploy-bundle-*.tar.gz'
  #     tar xzf portal-deploy-bundle-*.tar.gz -C /opt/portal
  #     cd /opt/portal && ./setup.sh
  #
  # Запускается ТОЛЬКО на релизном теге v* (как и публикация semver-тегов образов).
  # ────────────────────────────────────────────────────────────────────────────
  deploy-bundle:
    name: deploy-bundle / tarball для prod (ADR-046)
    runs-on: ubuntu-latest
    needs: [publish-images]
    if: startsWith(github.ref, 'refs/tags/v') && always() && needs.publish-images.result == 'success'
    permissions:
      contents: write  # для аттача asset'а к Release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Assemble deploy-bundle tarball
        run: |
          set -euo pipefail
          # Состав bundle: только то, что нужно для prod-деплоя (ADR-046).
          # Исходников backend/frontend/nginx/postgres/screenshot-service тут нет —
          # они едут внутри образов из GHCR.
          bundle_dir="$(mktemp -d)/portal-deploy"
          mkdir -p "$bundle_dir"

          # Каркас запуска.
          cp docker-compose.yml "$bundle_dir/"
          cp .env.example       "$bundle_dir/"
          cp setup.sh           "$bundle_dir/"
          chmod +x "$bundle_dir/setup.sh"

          # Observability-overlay целиком (config-файлы + node-exporter-textfile/
          # для локальной сборки portal-storage-collector — он не в registry).
          cp -r monitoring "$bundle_dir/"

          # Чистим runtime-мусор и тестовые данные, которые могли попасть в checkout.
          #   grafana/data, loki/data   — runtime volumes (если кто-то гонял overlay локально)
          #   loki/rules/fake/          — тестовый rules-файл (для CI/локальных прогонов)
          #   textfile/storage.prom     — runtime-данные с машины сборки (генерируется
          #                              storage-collector'ом на месте; .gitkeep оставляем)
          rm -rf \
            "$bundle_dir/monitoring/grafana/data" \
            "$bundle_dir/monitoring/loki/data" \
            "$bundle_dir/monitoring/loki/rules/fake" \
            "$bundle_dir/monitoring/textfile/storage.prom" \
            "$bundle_dir/.git"

          # Краткий README внутри bundle — чтобы на проде было понятно, что делать.
          cat > "$bundle_dir/DEPLOY-BUNDLE-README.md" << 'READMEEOF'
          # Portal — deploy-bundle (ADR-046)

          Минимальный набор файлов для prod-деплоя без git-клона репозитория.
          Образы тянутся из GHCR (ADR-045).

          ## Первый запуск

          ```bash
          cd /opt/portal  # куда распакован bundle
          ./setup.sh      # → пункт 5 (выбрать профиль "prod") → пункт 1 (запуск)
          ```

          ## Обновление

          ```bash
          # Скачать свежий bundle и распаковать поверх (с заменой):
          gh release download v1.2.3 -p 'portal-deploy-bundle-*.tar.gz'
          tar xzf portal-deploy-bundle-*.tar.gz -C /opt/portal
          cd /opt/portal && ./setup.sh   # → пункт 6 (Обновить Production)
          ```

          ## Что в bundle, чего в нём НЕТ

          - ЕСТЬ: docker-compose.yml, .env.example, setup.sh, monitoring-overlay
          - НЕТ: исходники backend/frontend/nginx/postgres/screenshot-service,
                 тесты, документация, .git — всё это не нужно на проде.
          READMEEOF

          tar -czf "portal-deploy-bundle-${GITHUB_REF_NAME}.tar.gz" -C "$(dirname "$bundle_dir")" portal-deploy
          ls -lh "portal-deploy-bundle-${GITHUB_REF_NAME}.tar.gz"

      - name: Attach bundle to Release
        # Pinned by SHA (supply-chain hardening): v2.6.2 — коммит 3bb12739.
        # У action contents: write (аттач asset'а к Release) — менее критичен,
        # чем packages:write, но для консистентности с publish-images пиним SHA.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: portal-deploy-bundle-${{ github.ref_name }}.tar.gz
